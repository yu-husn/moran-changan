 應用練習二｜二、虛詞判別"],"category":"single","partOfSpeechTypes":["助詞"]},{"id":"ALL-015","text":"要是糟蹋糧食，老天爺就不給咱們飯「了」。（陳之藩〈謝天〉）","answers":["助詞"],"explanation":"「了」位於句末表情況或語氣的變化，教材列助詞。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P55～P56 應用練習二｜二、虛詞判別"],"category":"single","partOfSpeechTypes":["助詞"]},{"id":"ALL-018","text":"「不僅」是那閃爍著的點點星星，「而且」是一大片重新再來的童年！（南方朔〈今夜看螢去〉）","answers":["連詞"],"explanation":"「不僅……而且……」連接有遞進關係的兩部分，兩者均列連詞。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P55～P56 應用練習二｜二、虛詞判別"],"category":"single","partOfSpeechTypes":["連詞"]},{"id":"ALL-019","text":"想要成功，「努力」很重要，遇到難關必須「努力」克服。","answers":["名詞","副詞"],"explanation":"第一處「努力」指一種付出或行動概念；第二處修飾「克服」，教材按句中功能列副詞。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜習作P21 二、同詞異質｜同詞異質"],"category":"mixed","partOfSpeechTypes":["名詞","副詞"]},{"id":"ALL-020","text":"儘管我再三「道歉」，她仍然不願意接受我的「道歉」。","answers":["動詞","名詞"],"explanation":"第一處「道歉」是表達歉意的行為；第二處是可被接受的道歉內容或行為概念。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜習作P21 二、同詞異質｜同詞異質"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-021","text":"這份「關鍵」的紀錄，可說是打破案件僵局的「關鍵」。","answers":["形容詞","名詞"],"explanation":"第一處「關鍵」描述紀錄重要而有決定作用；第二處指打破僵局的重要因素。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜習作P21 二、同詞異質｜同詞異質"],"category":"mixed","partOfSpeechTypes":["形容詞","名詞"]},{"id":"ALL-022","text":"這家餐廳為了「方便」顧客，推出十分「方便」的外送服務。","answers":["動詞","形容詞"],"explanation":"第一處「方便」表示使顧客便利，帶受益對象；第二處描述服務便利的性質。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜習作P21 二、同詞異質｜同詞異質"],"category":"mixed","partOfSpeechTypes":["動詞","形容詞"]},{"id":"ALL-023","text":"「自由」選擇想信仰的宗教，是《憲法》賦予人民的「自由」。","answers":["副詞","名詞"],"explanation":"第一處「自由」修飾「選擇」；第二處指人民享有的權利，教材依句中功能分為副詞、名詞。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜習作P21 二、同詞異質｜同詞異質"],"category":"mixed","partOfSpeechTypes":["副詞","名詞"]},{"id":"ALL-024","text":"受到暴雨的「影響」，農產地受損嚴重，也「影響」了菜價波動。","answers":["名詞","動詞"],"explanation":"第一處指暴雨造成的作用或後果；第二處表示對菜價產生作用。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜習作P21 二、同詞異質｜同詞異質"],"category":"mixed","p 練習一 詞性辨別"],"category":"single","partOfSpeechTypes":["量詞"]},{"id":"ALL-047","text":"札札「弄」機杼。","answers":["動詞"],"explanation":"「弄」表示操作、擺弄織布機的動作。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P54～P55｜應用練習一 詞性辨別"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-048","text":"可名為「惡」魔與妖巫之出世。","answers":["形容詞"],"explanation":"「惡」描述魔的邪惡性質，教材列形容詞。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P54～P55｜應用練習一 詞性辨別"],"category":"single","partOfSpeechTypes":["形容詞"]},{"id":"ALL-050","text":"造飲「輒」盡，期在必醉，既醉而退，曾不吝情去留。","answers":["副詞"],"explanation":"「輒」表示每每、總是，限制飲盡的頻率或情形。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P54～P55｜應用練習一 詞性辨別"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-051","text":"「二十」多年來，生活的天地僅限於「六」席大的斗室之中。","answers":["數詞","數詞"],"explanation":"「二十」表示年數，「六」表示席的數量，兩者均為數詞。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P54～P55｜應用練習一 詞性辨別"],"category":"single","partOfSpeechTypes":["數詞"]},{"id":"ALL-052","text":"「說明」書上的「說明」，明白地敘述新產品的使用方法。","answers":["形容詞","名詞"],"explanation":"原教材將第一處修飾「書」的「說明」列形容詞；第二處指解說內容，列名詞。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P56｜應用練習二 詞性辨析"],"category":"mixed","partOfSpeechTypes":["形容詞","名詞"]},{"id":"ALL-053","text":"他在出版社當「翻譯」，專門「翻譯」外國小說。","answers":["名詞","動詞"],"explanation":"第一處是職務或從業者的名稱；第二處是將外文轉成中文的行為。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P56｜應用練習二 詞性辨析"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-054","text":"「計畫」一次環島旅行，是他人生中最重要的「計畫」。","answers":["動詞","名詞"],"explanation":"第一處帶「一次環島旅行」這個對象，表示籌畫；第二處指方案、打算。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P56｜應用練習二 詞性辨析"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-055","text":"公司要員工在大廳「集會」，慶祝勞動節，但這次「集會」，來的員工卻很少。","answers":["動詞","名詞"],"explanation":"第一處表示聚集開會的行動；第二處由「這次」限定，指一次活動。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P56｜應用練習二 詞性辨析"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-056","text":"「聰明」人是把「聰明」用在對的地方。","answers":["形容詞","名詞"],"explanation":"第一處描述人的資質；第二處指智慧、才智，可作「把」字句的處置對象。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P56｜應用練習二 詞性辨析"],"category":"mixed","partOfSpeechTypes":["形容詞","名詞"]},{"id":"ALL-057","text":"她從「希臘」回來，穿著都變得很「希臘」。","answers":["名詞","形容詞"],"explanation":"第一處是國名；第二處受程度副詞「很」修飾，表示有希臘風格，屬活用。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P56｜應用練習二 詞性辨析"],"category":"mixed","partOfSpeechTypes":["名詞","形容詞"]},{"id":"ALL-062","text":"「慈」眉「善」目。","answers":["形容詞","形容詞"],"explanation":"慈、善分別描述眉、目呈現的神態。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P50～P54｜詞類表例句"],"category":"single","partOfSpeechTypes":["形容詞"]},{"id":"ALL-065","text":"老師來「自」澎湖。","answers":["介詞"],"explanation":"自引進來源或出發處。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P50～P54｜詞類表例句"],"category":"single","partOfSpeechTypes":["介詞"]},{"id":"ALL-067","text":"「從」頭「到」腳都是新的。","answers":["介詞","介詞"],"explanation":"從、到分別引進範圍起點、終點。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P50～P54｜詞類表例句"],"category":"single","partOfSpeechTypes":["介詞"]},{"id":"ALL-068","text":"「為」愛走天涯。","answers":["介詞"],"explanation":"為引進目的或原因。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P50～P54｜詞類表例句"],"category":"single","partOfSpeechTypes":["介詞"]},{"id":"ALL-070","text":"生「於」斯，長「於」斯。","answers":["介詞","介詞"],"explanation":"於引進生長的處所。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P50～P54｜詞類表例句"],"category":"single","partOfSpeechTypes":["介詞"]},{"id":"ALL-072","text":"「雖然」我的手不再美麗，「但」我希望它多學習一點付出的功課。","answers":["連詞","連詞"],"explanation":"雖然、但連接轉折關係分句。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P50～P54｜詞類表例句"],"category":"single","partOfSpeechTypes":["連詞"]},{"id":"ALL-075","text":"「與其」坐而言，「不如」起而行。","answers":["連詞","連詞"],"explanation":"與其、不如表比較與取捨。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P50～P54｜詞類表例句"],"category":"single","partOfSpeechTypes":["連詞"]},{"id":"ALL-077","text":"可別太快開動「啊」！","answers":["助詞"],"explanation":"啊附在完整語句之後表語氣。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P50～P54｜詞類表例句"],"category":"single","partOfSpeechTypes":["助詞"]},{"id":"ALL-080","text":"舟已行「矣」。","answers":["助詞"],"explanation":"矣附在句尾表示完成或情況改變。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P50～P54｜詞類表例句"],"category":"single","partOfSpeechTypes":["助詞"]},{"id":"ALL-081","text":"果然鶴「也」。","answers":["助詞"],"explanation":"也附在句末表判斷。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P50～P54｜詞類表例句"],"category":"single","partOfSpeechTypes":["助詞"]},{"id":"ALL-085","text":"「喔」！是這樣嗎？","answers":["嘆詞"],"explanation":"喔用來回應、表示領會。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P50～P54｜詞類表例句"],"category":"single","partOfSpeechTypes":["嘆詞"]},{"id":"ALL-090","text":"一「場」大西北雨、一「粒」粒又香又脆的炒胡豆。","answers":["量詞","量詞"],"explanation":"場計算雨的場次，粒計算豆子；粒粒重疊表示每粒或很多粒。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P51｜詞類表例句"],"category":"single","partOfSpeechTypes":["量詞"]},{"id":"ALL-091","text":"「孰」大於是？","answers":["代詞"],"explanation":"孰在此表示什麼，屬疑問代詞。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P50上方補充｜詞類表例句"],"category":"single","partOfSpeechTypes":["代詞"]},{"id":"ALL-092","text":"「孰」能無過？","answers":["代詞"],"explanation":"孰表示誰，屬疑問代詞。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P50上方補充｜詞類表例句"],"category":"single","partOfSpeechTypes":["代詞"]},{"id":"ALL-094","text":"有楚大夫「於」此。","answers":["介詞"],"explanation":"於引進處所，在這裡。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P52｜詞類表例句"],"category":"single","partOfSpeechTypes":["介詞"]},{"id":"ALL-095","text":"一口吐「而」二蟲盡為所吞。","answers":["連詞"],"explanation":"而連接動作與隨後結果。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P52｜詞類表例句"],"category":"single","partOfSpeechTypes":["連詞"]},{"id":"ALL-098","text":"「雖然」下雨了，「但」還是熱得不得了。","answers":["連詞","連詞"],"explanation":"雖然、但表轉折。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P52｜詞類表例句"],"category":"single","partOfSpeechTypes":["連詞"]},{"id":"ALL-101","text":"「嗚呼哀哉」！","answers":["嘆詞"],"explanation":"嗚呼哀哉獨立表悲嘆。","sources":["04-國中國文2上備課-語文常識一-語法(上)詞類(直式對頁)(115f296500).doc｜P53｜詞類表例句"],"category":"single","partOfSpeechTypes":["嘆詞"]},{"id":"ALL-102-1","text":"你沒事就大獻「殷勤」，不得不令人懷疑你的「殷勤」是否另有居心","answers":["名詞","名詞"],"explanation":"兩處「殷勤」都指熱切周到的表示，是可以被獻出或被懷疑的對象，皆為名詞。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P57-2～P57-3｜歷屆試題精選"],"category":"single","partOfSpeechTypes":["名詞"]},{"id":"ALL-102-2","text":"這棵「落葉」喬木，每到秋天就飄落滿地的「落葉」，總令人感覺蕭瑟","answers":["形容詞","名詞"],"explanation":"第一處「落葉」修飾名詞「喬木」，依本題採用的句中功能分類列形容詞；第二處指掉落的葉子，是名詞。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P57-2～P57-3｜歷屆試題精選"],"category":"mixed","partOfSpeechTypes":["形容詞","名詞"]},{"id":"ALL-102-3","text":"一次「偶然」的邂逅，成就了一樁美滿的姻緣，真是美麗的「偶然」啊","answers":["形容詞","名詞"],"explanation":"第一處「偶然」修飾名詞「邂逅」，是形容詞；第二處指偶然發生的事件，是名詞。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P57-2～P57-3｜歷屆試題精選"],"category":"mixed","partOfSpeechTypes":["形容詞","名詞"]},{"id":"ALL-102-4","text":"他雖處境艱困，但仍「樂觀」的過每一天，這種「樂觀」的態度令人動容","answers":["副詞","形容詞"],"explanation":"第一處「樂觀」修飾動詞「過」，是副詞；第二處修飾名詞「態度」，是形容詞。","sources":["04_115國中國文2上備課(橫式)_語一_語法(上)詞類介紹.doc｜P57-2～P57-3｜歷屆試題精選"],"category":"mixed","partOfSpeechTypes":["副詞","形容詞"]},{"id":"ALL-103","text":"孔子說：生，於我乎「館」／請問這兒是李公「館」嗎","answers":["動詞","名詞"],"explanation":"表示住宿。；指公館、住所。","sources":["90基測一 第28題A"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-104","text":"「淑」世是孔子的理想／被愛沖昏頭的你，當心遇人不「淑」","answers":["動詞","形容詞"],"explanation":"淑世指改善世道人心。；指善良、美好。","sources":["90基測一 第28題B"],"category":"mixed","partOfSpeechTypes":["動詞","形容詞"]},{"id":"ALL-105","text":"遲到的我，只能「白」瞪著眼，看火車離開／再怎麼勸他，也是「白」費力氣","answers":["副詞","副詞"],"explanation":"表示徒然，修飾瞪。；表示徒然，修飾費力氣。","sources":["90基測一 第28題C"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-106","text":"他說完了這句格言，就「絕」了氣／我「絕」不答應你的要求，別打如意算盤了","answers":["動詞","副詞"],"explanation":"表示斷、停止。；表示絕對，修飾不答應。","sources":["90基測一 第28題D"],"category":"mixed","partOfSpeechTypes":["動詞","副詞"]},{"id":"ALL-107","text":"她很「寶貝」自己的衣服","answers":["動詞"],"explanation":"表示珍愛、愛惜，後接衣服。","sources":["90基測一 第31題A"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-108","text":"班長的行為非常「商人」","answers":["形容詞"],"explanation":"在此形容行為有商人特質；原為名詞，於本句轉品。","sources":["90基測一 第31題B"],"category":"single","partOfSpeechTypes":["形容詞"]},{"id":"ALL-113","text":"白日依山「盡」","answers":["動詞"],"explanation":"表示消失、落下。","sources":["90基測二 第14題C"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-114","text":"「但」使願無違","answers":["副詞"],"explanation":"表示只，依原題詞類系統判定；勿把「但使」整組當同一詞。","sources":["90基測二 第14題D"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-116","text":"月「暗」星稀，蟲鳴雜奏","answers":["形容詞"],"explanation":"描述月色昏暗。","sources":["90基測二 第41題B"],"category":"single","partOfSpeechTypes":["形容詞"]},{"id":"ALL-121","text":"他「急急忙忙」的跑走了","answers":["副詞"],"explanation":"修飾跑走的動作；依原題傳統詞類分類。","sources":["91基測一 第11題C"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-123","text":"讓我們盡情「享受」美麗的人生／一流的設施提供旅客最佳的「享受」","answers":["動詞","名詞"],"explanation":"表示領受、體驗，後接人生。；指獲得的滿足或待遇，受最佳修飾。","sources":["91基測一 第13題A"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-124","text":"事情被揭穿後，他的「反應」很激烈／若有疑問，請向本單位「反應」","answers":["名詞","動詞"],"explanation":"指表現出的態度或行為。；表示表達、反映意見；保留原題用字。","sources":["91基測一 第13題B"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-126","text":"孔 孟思想深深「影響」著我們／因為這次旱災的「影響」，蔬菜產量銳減","answers":["動詞","名詞"],"explanation":"表示作用於我們。；指旱災造成的作用或結果。","sources":["91基測一 第13題D"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-127","text":"「自由」選擇工作，是憲法賦予我們每個人的「自由」","answers":["副詞","名詞"],"explanation":"修飾選擇，表示不受限制地。；指憲法保障的權利。","sources":["91基測二 第16題A"],"category":"mixed","partOfSpeechTypes":["副詞","名詞"]},{"id":"ALL-128","text":"「規劃」一次環球旅遊，一直是他人生中最重要的「規劃」","answers":["動詞","名詞"],"explanation":"表示安排旅遊。；指人生中的計畫。","sources":["91基測二 第16題B"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-131","text":"各候選人「大肆」抨擊執政黨的新政策","answers":["副詞"],"explanation":"修飾抨擊，表示毫無顧忌地。","sources":["91基測二 第27題A"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-132","text":"演講時，態度宜「從容」，音量宜適中","answers":["形容詞"],"explanation":"描述態度不慌不忙。","sources":["91基測二 第27題B"],"category":"single","partOfSpeechTypes":["形容詞"]},{"id":"ALL-135","text":"在得「眼翳」病期間，他總用帽子將臉「翳」住，羞於被人看見，直到遇見那一群勇於面對命運挑戰的殘障孩子。","answers":["名詞","動詞"],"explanation":"指眼病；擴成完整詞，避免眼翳病中的切詞爭議。；表示遮蔽、遮住。","sources":["92基測一 第16題A"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-136","text":"他「尤」注意那名失去雙腿的少女，在她的臉上，總掛著不怨天不「尤」人的微笑","answers":["副詞","動詞"],"explanation":"表示尤其，修飾注意。；表示責怪。","sources":["92基測一 第16題B"],"category":"mixed","partOfSpeechTypes":["副詞","動詞"]},{"id":"ALL-139","text":"我將他給我做的紫色毛衣「鋪」好座位／他在一個錢「鋪」裡做夥計","answers":["動詞","名詞"],"explanation":"表示攤開、鋪放。；指店鋪。","sources":["92基測一 第25題A"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-140","text":"「極」其言，茲若人之儔乎／要革除一種惡習慣，便須下「極」大的決心","answers":["動詞","副詞"],"explanation":"表示窮盡、詳盡說明。；修飾大，表示非常。","sources":["92基測一 第25題B"],"category":"mixed","partOfSpeechTypes":["動詞","副詞"]},{"id":"ALL-141","text":"再向外看時，他已抱著橘子「望」回走了／他能從這扇門「望」見日出美景","answers":["介詞","動詞"],"explanation":"表示朝、向，引出移動方向。；表示看、看見。","sources":["92基測一 第25題C"],"category":"mixed","partOfSpeechTypes":["介詞","動詞"]},{"id":"ALL-142","text":"有人力爭上游；有人「卻」自甘墮落／這「卻」不然，責任要解除了才沒有","answers":["副詞","副詞"],"explanation":"表示轉折語氣，依原題詞類系統。；表示轉折語氣，依原題詞類系統。","sources":["92基測一 第25題D"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-144","text":"招待不周，請多「見」諒","answers":["助詞"],"explanation":"原題稱代詞性助詞，帶有指向說話者的作用：見諒即原諒我。","sources":["92基測一 第30題B"],"category":"single","partOfSpeechTypes":["助詞"]},{"id":"ALL-145","text":"閣下所言，何以「見」得","answers":["動詞"],"explanation":"表示看出、認定。","sources":["92基測一 第30題C"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-147","text":"願為「市」鞍馬，從此替爺征","answers":["動詞"],"explanation":"名詞轉用，表示買。","sources":["92基測二 第34題A"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-148","text":"捉蝦蟆，「鞭」數十，驅之別院","answers":["動詞"],"explanation":"名詞轉用，表示用鞭子打。","sources":["92基測二 第34題B"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-149","text":"生，於我乎「館」；死，於我乎殯","answers":["動詞"],"explanation":"名詞轉用，表示住宿。","sources":["92基測二 第34題C"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-150","text":"揖讓而升，下而「飲」，其爭也君子","answers":["動詞"],"explanation":"表示喝；本來就是動詞，非本題所說名詞轉用。","sources":["92基測二 第34題D"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-153","text":"我「和」他是好朋友","answers":["連詞"],"explanation":"連接我與他，組成並列主語。","sources":["93基測一 第25題C"],"category":"single","partOfSpeechTypes":["連詞"]},{"id":"ALL-154","text":"「為」何你要丟棄它","answers":["介詞"],"explanation":"為何即為什麼，引出原因。","sources":["93基測一 第25題D"],"category":"single","partOfSpeechTypes":["介詞"]},{"id":"ALL-155","text":"多多使用再生紙，既「經濟」又環保","answers":["形容詞"],"explanation":"表示節省、合算，描述使用再生紙的特點。","sources":["93基測一 第31題A"],"category":"single","partOfSpeechTypes":["形容詞"]},{"id":"ALL-156","text":"「經濟」不景氣，失業人口大幅增加","answers":["名詞"],"explanation":"指社會生產、消費等活動的總體情況。","sources":["93基測一 第31題B"],"category":"single","partOfSpeechTypes":["名詞"]},{"id":"ALL-157","text":"「經濟」自期是知識分子應有的抱負","answers":["動詞"],"explanation":"本參考解作經世濟民；原句可有名物化分析，需教師複核。","sources":["93基測一 第31題C"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-158","text":"古聖先賢皆能以道德「經濟」為己任","answers":["名詞"],"explanation":"本參考解作經世濟民之學或事業；也可將經世濟民看作動詞性成分，需教師複核。","sources":["93基測一 第31題D"],"category":"single","partOfSpeechTypes":["名詞"]},{"id":"ALL-161","text":"良馬馳騁千里後，仍然不「息」不汗","answers":["動詞"],"explanation":"表示休息、停止。","sources":["93基測一 第33題C"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-162","text":"我不想再過這種仰人鼻「息」的日子","answers":["名詞"],"explanation":"指氣息。","sources":["93基測一 第33題D"],"category":"single","partOfSpeechTypes":["名詞"]},{"id":"ALL-164","text":"開筵面場圃，「把」酒話桑麻","answers":["動詞"],"explanation":"表示持、拿，不是現代處置句中的介詞。","sources":["93基測二 第8題B"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-165","text":"策「勳」十二轉，賞賜百千強","answers":["名詞"],"explanation":"指功勞。","sources":["93基測二 第8題C"],"category":"single","partOfSpeechTypes":["名詞"]},{"id":"ALL-166","text":"隨意春芳「歇」，王孫自可留","answers":["動詞"],"explanation":"表示止息、消歇。","sources":["93基測二 第8題D"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-168","text":"憲兵「直挺挺」的站在司令臺前，一動也不動","answers":["副詞"],"explanation":"修飾站；依原題詞類分類。","sources":["94基測一 第5題B"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-170","text":"他「眼睜睜」的看著考試時間流逝，卻不知如何作答","answers":["副詞"],"explanation":"修飾看；依原題詞類分類。","sources":["94基測一 第5題D"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-171","text":"「銀」燭朝天紫陌長，禁城春色曉蒼蒼","answers":["形容詞"],"explanation":"形容燭的色澤；也有以材質名詞作修飾成分的分析，需教師複核。","sources":["94基測二 第18題A"],"category":"single","partOfSpeechTypes":["形容詞"]},{"id":"ALL-172","text":"最是秋風管閒事，紅他楓葉「白」人頭","answers":["動詞"],"explanation":"表示使人的頭髮變白，形容詞轉作動詞。","sources":["94基測二 第18題B"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-174","text":"連山晚照「紅」，遠岸秋沙白","answers":["形容詞"],"explanation":"描述晚照的顏色、狀態。","sources":["94基測二 第18題D"],"category":"single","partOfSpeechTypes":["形容詞"]},{"id":"ALL-176","text":"做事當惟力「是」視，不要逞強稱能","answers":["助詞"],"explanation":"標示賓語提前：惟力是視。","sources":["95基測二 第29題B"],"category":"single","partOfSpeechTypes":["助詞"]},{"id":"ALL-178","text":"他所提出的計畫，被主管批評得一無「是」處","answers":["形容詞"],"explanation":"表示正確、對；一無是處指沒有一點正確或可取之處。","sources":["95基測二 第29題D"],"category":"single","partOfSpeechTypes":["形容詞"]},{"id":"ALL-182","text":"最後「一致」仰首搖頭","answers":["副詞"],"explanation":"修飾仰首搖頭，表示一同、同樣地。","sources":["95基測二 第39題D"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-183","text":"匹「練」抹林","answers":["名詞"],"explanation":"指潔白的絲織品。","sources":["96基測一 第47題A"],"category":"single","partOfSpeechTypes":["名詞"]},{"id":"ALL-184","text":"「籠」樓臺而隱隱","answers":["動詞"],"explanation":"表示籠罩。","sources":["96基測一 第47題B"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-186","text":"勝概之一「助」","answers":["名詞"],"explanation":"指助力。","sources":["96基測一 第47題D"],"category":"single","partOfSpeechTypes":["名詞"]},{"id":"ALL-187","text":"「衣」旃衣，披羊裘","answers":["動詞"],"explanation":"表示穿著，讀ㄧˋ。","sources":["96基測二 第44題A"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-188","text":"虞將軍脫其身上「衣」以衣之","answers":["名詞"],"explanation":"指衣服，讀ㄧ。","sources":["96基測二 第44題B"],"category":"single","partOfSpeechTypes":["名詞"]},{"id":"ALL-189","text":"敬本「衣」帛，則衣帛見","answers":["動詞"],"explanation":"表示穿著，讀ㄧˋ。","sources":["96基測二 第44題C"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-191","text":"「否」極泰來","answers":["名詞"],"explanation":"讀ㄆㄧˇ，指困厄、不順的境況；原為卦名。","sources":["97基測二 第32題A"],"category":"single","partOfSpeechTypes":["名詞"]},{"id":"ALL-192","text":"「莫」測高深","answers":["副詞"],"explanation":"表示不能、不，修飾測。","sources":["97基測二 第32題B"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-193","text":"無遠「弗」屆","answers":["副詞"],"explanation":"表示不，修飾屆。","sources":["97基測二 第32題C"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-195","text":"「命」器必新","answers":["動詞"],"explanation":"表示要求、命令。","sources":["98基測二 第44題A"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-196","text":"請「斂」於民","answers":["動詞"],"explanation":"表示徵收。","sources":["98基測二 第44題B"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-197","text":"今上「樂」其樂","answers":["動詞"],"explanation":"表示以某事為樂、感到快樂。","sources":["98基測二 第44題C"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-200","text":"老師「期盼」大家能夠團結一致／上臺領獎一直是我最大的「期盼」","answers":["動詞","名詞"],"explanation":"表示期待。；指期待的事或願望。","sources":["100北北基 第6題B"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-201","text":"學生應「修養」良好的品德／他的「修養」工夫到家，從不與人爭執","answers":["動詞","名詞"],"explanation":"表示培養、修習。；指品德涵養；原頁另有形容詞分析，需教師複核。","sources":["100北北基 第6題C"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-202","text":"轟然的雷聲嚇得我手腳「顫抖」／他用「顫抖」的聲音訴說昨晚的遭遇","answers":["動詞","形容詞"],"explanation":"表示發抖。；描述聲音的狀態；依原題傳統分類。","sources":["100北北基 第6題D"],"category":"mixed","partOfSpeechTypes":["動詞","形容詞"]},{"id":"ALL-203","text":"侍者「為」之悚慄","answers":["介詞"],"explanation":"引出原因或對象；原頁各家釋義不同，詞類同為介詞。","sources":["106會考 第45題D"],"category":"single","partOfSpeechTypes":["介詞"]},{"id":"ALL-206","text":"「原來」他有難言之隱，「難怪」總是愁眉不展。","answers":["副詞","副詞"],"explanation":"表示發現原先不知道的情況。；表示了解原因後不覺奇怪。","sources":["112會考 第2題C"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-207","text":"「與其」讓你在事後落淚，「不如」事先提醒你，避免你犯錯懊悔。","answers":["連詞","連詞"],"explanation":"引出取捨前項。；引出較取的後項。","sources":["112會考 第2題D"],"category":"single","partOfSpeechTypes":["連詞"]},{"id":"ALL-208","text":"她是全家的「寶貝」，她則很「寶貝」奶奶送的舊外套。","answers":["名詞","動詞"],"explanation":"前者指被珍愛的人；後者表示珍愛、愛惜，後接舊外套。","sources":["AI 原創題庫｜NEW-POS-01"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-209","text":"我們先仔細「計畫」旅程，再把這份「計畫」交給老師。","answers":["動詞","名詞"],"explanation":"前者表示籌畫的動作；後者指寫成的方案，可受這份限定。","sources":["AI 原創題庫｜NEW-POS-02"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-210","text":"老師的一項「安排」，讓原本不熟的我們開始一起「安排」班遊。","answers":["名詞","動詞"],"explanation":"前者指一項處置或規畫；後者表示規畫班遊的動作。","sources":["AI 原創題庫｜NEW-POS-03","穿越遊戲原第6題｜NEW-POS-03"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-211","text":"她每天都「練習」朗讀，今天終於完成了最後一次「練習」。","answers":["動詞","名詞"],"explanation":"前者表示反覆學習的動作；後者指一次訓練活動。","sources":["AI 原創題庫｜NEW-POS-04","穿越遊戲原第7題｜NEW-POS-04"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-212","text":"那項「研究」受到重視後，更多學者開始「研究」這種疾病。","answers":["名詞","動詞"],"explanation":"前者指一項研究工作或成果；後者表示探究疾病。","sources":["AI 原創題庫｜NEW-POS-05","穿越遊戲原第8題｜NEW-POS-05"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-213","text":"警方正在「調查」這起案件，這次「調查」預計下週結束。","answers":["動詞","名詞"],"explanation":"前者表示查明案情的動作；後者指這次查訪活動。","sources":["AI 原創題庫｜NEW-POS-06","穿越遊戲原第9題｜NEW-POS-06"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-214","text":"聽完這份「報告」，主任請我再向校長「報告」處理進度。","answers":["名詞","動詞"],"explanation":"前者指書面或口頭的報告內容；後者表示陳述進度。","sources":["AI 原創題庫｜NEW-POS-07","穿越遊戲原第16題｜NEW-POS-07"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-215","text":"我們先「討論」比賽規則，再把這次「討論」的結果寫下來。","answers":["動詞","形容詞"],"explanation":"第一處「討論」表示討論規則的動作，列動詞；第二處「討論」修飾「結果」，依本題採用的句中修飾功能分類，列形容詞。","sources":["AI 原創題庫｜NEW-POS-08","穿越遊戲原第17題｜NEW-POS-08"],"category":"mixed","partOfSpeechTypes":["動詞","形容詞"]},{"id":"ALL-216","text":"他提出的一項「建議」，讓老師也「建議」全班重新分工。","answers":["名詞","動詞"],"explanation":"前者指意見；後者表示提出意見，後接所建議的行動。","sources":["AI 原創題庫｜NEW-POS-09"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-217","text":"老師「要求」大家準時交件，這項「要求」並不過分。","answers":["動詞","名詞"],"explanation":"前者表示提出必須做到的事項；後者指這項規定。","sources":["AI 原創題庫｜NEW-POS-10","穿越遊戲原第18題｜NEW-POS-10"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-218","text":"這個「決定」影響很大，因此我們不能倉促「決定」下一步。","answers":["名詞","動詞"],"explanation":"前者指決定的結果；後者表示作出判斷與選定。","sources":["AI 原創題庫｜NEW-POS-11","穿越遊戲原第19題｜NEW-POS-11"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-219","text":"我不願替你「選擇」，因為這是你自己的「選擇」。","answers":["動詞","名詞"],"explanation":"前者表示挑選的動作；後者指由你作出的選定或抉擇。","sources":["AI 原創題庫｜NEW-POS-12","穿越遊戲原第26題｜NEW-POS-12"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-220","text":"即使只剩一線「希望」，我們仍「希望」搜救隊不要放棄。","answers":["名詞","動詞"],"explanation":"前者指可能實現的機會或盼望；後者表示盼望某件事發生。","sources":["AI 原創題庫｜NEW-POS-13","穿越遊戲原第27題｜NEW-POS-13"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-221","text":"謝謝你一直「支持」我，你的「支持」讓我有勇氣繼續。","answers":["動詞","名詞"],"explanation":"前者表示給予幫助與肯定；後者指這種幫助與肯定。","sources":["AI 原創題庫｜NEW-POS-14","穿越遊戲原第28題｜NEW-POS-14"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-222","text":"他的「幫助」讓我度過難關，也教會我主動「幫助」別人。","answers":["名詞","動詞"],"explanation":"前者指得到的援助；後者表示援助別人的動作。","sources":["AI 原創題庫｜NEW-POS-15","穿越遊戲原第29題｜NEW-POS-15"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-223","text":"老師總是「鼓勵」我，而這份「鼓勵」也讓我敢於上臺。","answers":["動詞","名詞"],"explanation":"前者表示給人信心；後者指得到的激勵。","sources":["AI 原創題庫｜NEW-POS-16","穿越遊戲原第36題｜NEW-POS-16"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-224","text":"她送來的一句「安慰」，讓我也學會如何「安慰」正在哭泣的弟弟。","answers":["名詞","動詞"],"explanation":"前者指安慰的話；後者表示使人寬心的行為。","sources":["AI 原創題庫｜NEW-POS-17","穿越遊戲原第37題｜NEW-POS-17"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-225","text":"我真心「祝福」你，也把這份「祝福」寫進卡片裡。","answers":["動詞","名詞"],"explanation":"前者表示表達美好祝願；後者指這份祝願。","sources":["AI 原創題庫｜NEW-POS-18","穿越遊戲原第38題｜NEW-POS-18"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-226","text":"他記得當年的「承諾」，所以不肯輕易「承諾」自己做不到的事。","answers":["名詞","動詞"],"explanation":"前者指先前答應的內容；後者表示答應、保證。","sources":["AI 原創題庫｜NEW-POS-19","穿越遊戲原第39題｜NEW-POS-19"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-227","text":"學校「邀請」作家來演講，作家欣然接受了這次「邀請」。","answers":["動詞","名詞"],"explanation":"前者表示請人前來；後者指一次邀約。","sources":["AI 原創題庫｜NEW-POS-20","穿越遊戲原第46題｜NEW-POS-20"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-228","text":"多虧你的「提醒」，我才記得要「提醒」弟弟帶雨傘。","answers":["名詞","動詞"],"explanation":"前者指提醒的話或行動；後者表示使弟弟記起某事。","sources":["AI 原創題庫｜NEW-POS-21","穿越遊戲原第47題｜NEW-POS-21"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-229","text":"這些資料足以「證明」他的說法，但還不能當作正式的書面「證明」。","answers":["動詞","名詞"],"explanation":"前者表示以證據說明；後者指證明文件。","sources":["AI 原創題庫｜NEW-POS-22"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-230","text":"這份「設計」很有巧思，難怪老師請他替校慶「設計」海報。","answers":["名詞","動詞"],"explanation":"前者指設計方案或成果；後者表示構思、製作海報。","sources":["AI 原創題庫｜NEW-POS-23","穿越遊戲原第48題｜NEW-POS-23"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-231","text":"孩子們輪流「表演」魔術，其中一場「表演」讓全班笑得合不攏嘴。","answers":["動詞","名詞"],"explanation":"前者表示演示魔術；後者指一場演出活動。","sources":["AI 原創題庫｜NEW-POS-24","穿越遊戲原第49題｜NEW-POS-24"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-232","text":"他珍惜這份「工作」，所以每天都很認真地「工作」。","answers":["名詞","動詞"],"explanation":"前者指職業或職務；後者表示從事勞動。","sources":["AI 原創題庫｜NEW-POS-25"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-233","text":"睡飽後，他不但恢復了「精神」，看起來也比昨天「精神」。","answers":["名詞","形容詞"],"explanation":"前者指精力、活力；後者形容神采奕奕的樣子。","sources":["AI 原創題庫｜NEW-POS-26"],"category":"mixed","partOfSpeechTypes":["名詞","形容詞"]},{"id":"ALL-234","text":"為了振興「經濟」，市府採用了更「經濟」的宣傳方式。","answers":["名詞","形容詞"],"explanation":"前者指生產、消費等活動的整體情況；後者形容節省、合算。","sources":["AI 原創題庫｜NEW-POS-27"],"category":"mixed","partOfSpeechTypes":["名詞","形容詞"]},{"id":"ALL-235","text":"他雖然熟記每一條「規矩」，排隊時卻一點也不「規矩」。","answers":["名詞","形容詞"],"explanation":"前者指應遵守的規則；後者形容行為是否端正守分。","sources":["AI 原創題庫｜NEW-POS-28"],"category":"mixed","partOfSpeechTypes":["名詞","形容詞"]},{"id":"ALL-236","text":"她的「理想」是成為畫家，目前的學習成果也十分「理想」。","answers":["名詞","形容詞"],"explanation":"前者指志向；後者形容符合期望、令人滿意。","sources":["AI 原創題庫｜NEW-POS-29"],"category":"mixed","partOfSpeechTypes":["名詞","形容詞"]},{"id":"ALL-237","text":"依照這項「標準」，他的發音已經相當「標準」。","answers":["名詞","形容詞"],"explanation":"前者指衡量準則；後者形容發音合乎規範。","sources":["AI 原創題庫｜NEW-POS-30"],"category":"mixed","partOfSpeechTypes":["名詞","形容詞"]},{"id":"ALL-238","text":"他們渴望「光明」，也相信只要努力，前途就會「光明」。","answers":["名詞","形容詞"],"explanation":"前者指光亮或美好的境界；後者描述前途充滿希望。","sources":["AI 原創題庫｜NEW-POS-31"],"category":"mixed","partOfSpeechTypes":["名詞","形容詞"]},{"id":"ALL-239","text":"孩子的「快樂」，也「快樂」了這座原本冷清的家。","answers":["名詞","動詞"],"explanation":"前者指快樂的感受；後者是刻意的文學轉品，表示使這個家充滿快樂，不是日常慣用動詞。","sources":["AI 原創題庫｜NEW-POS-32"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-240","text":"他的態度十分「認真」，也總是「認真」地完成每一項任務。","answers":["形容詞","副詞"],"explanation":"前者描述態度；後者修飾完成的動作。本題依基測常用的句中功能分類。","sources":["AI 原創題庫｜NEW-POS-33"],"category":"mixed","partOfSpeechTypes":["形容詞","副詞"]},{"id":"ALL-241","text":"這份禮物很「特別」，所以我一直「特別」珍惜它。","answers":["形容詞","副詞"],"explanation":"前者形容禮物與眾不同；後者修飾珍惜，表示格外。","sources":["AI 原創題庫｜NEW-POS-34"],"category":"mixed","partOfSpeechTypes":["形容詞","副詞"]},{"id":"ALL-242","text":"圖書館裡十分「安靜」，每個人都「安靜」地閱讀。","answers":["形容詞","副詞"],"explanation":"前者描述環境狀態；後者修飾閱讀。本題依基測常用的句中功能分類。","sources":["AI 原創題庫｜NEW-POS-35"],"category":"mixed","partOfSpeechTypes":["形容詞","副詞"]},{"id":"ALL-243","text":"現場的氣氛十分「熱烈」，觀眾也「熱烈」地鼓掌。","answers":["形容詞","副詞"],"explanation":"前者描述氣氛；後者修飾鼓掌。本題依基測常用的句中功能分類。","sources":["AI 原創題庫｜NEW-POS-36"],"category":"mixed","partOfSpeechTypes":["形容詞","副詞"]},{"id":"ALL-244","text":"我們有「共同」的目標，因此願意「共同」完成這項任務。","answers":["形容詞","副詞"],"explanation":"前者修飾目標；後者修飾完成，表示一起。本題依句中功能分類。","sources":["AI 原創題庫｜NEW-POS-37"],"category":"mixed","partOfSpeechTypes":["形容詞","副詞"]},{"id":"ALL-245","text":"他珍惜得來不易的「自由」，也尊重別人「自由」地表達意見。","answers":["名詞","副詞"],"explanation":"前者指不受拘束的權利或狀態；後者修飾表達。本題依原基測題型的句中功能分類。","sources":["AI 原創題庫｜NEW-POS-38"],"category":"mixed","partOfSpeechTypes":["名詞","副詞"]},{"id":"ALL-246","text":"經常親近「自然」的人，「自然」更容易察覺季節的變化。","answers":["名詞","副詞"],"explanation":"前者指大自然；後者表示自然而然，修飾更容易察覺。","sources":["AI 原創題庫｜NEW-POS-39"],"category":"mixed","partOfSpeechTypes":["名詞","副詞"]},{"id":"ALL-247","text":"爺爺與老友「把」酒言歡後，才「把」酒杯放回桌上。","answers":["動詞","介詞"],"explanation":"前者表示持、拿；後者引出被處置的對象酒杯。","sources":["AI 原創題庫｜NEW-POS-40","穿越遊戲原第10題｜NEW-POS-40"],"category":"mixed","partOfSpeechTypes":["動詞","介詞"]},{"id":"ALL-249","text":"他一生「為」善，也常「為」陌生人伸出援手。","answers":["動詞","介詞"],"explanation":"前者讀ㄨㄟˊ，表示做、行；後者讀ㄨㄟˋ，表示替，引出受益對象。","sources":["AI 原創題庫｜NEW-POS-43","穿越遊戲原第40題｜NEW-POS-43"],"category":"mixed","partOfSpeechTypes":["動詞","介詞"]},{"id":"ALL-251","text":"我「但」求問心無愧，「但」他仍堅持要我爭取第一。","answers":["副詞","連詞"],"explanation":"前者表示只，修飾求；後者表示可是，連接轉折分句。","sources":["AI 原創題庫｜NEW-POS-46"],"category":"mixed","partOfSpeechTypes":["副詞","連詞"]},{"id":"ALL-252","text":"「啊」，原來你躲在這裡，真讓我好找「啊」！","answers":["嘆詞","助詞"],"explanation":"前者獨立表達發現時的驚訝；後者附在句尾，加強語氣。","sources":["AI 原創題庫｜NEW-POS-47"],"category":"mixed","partOfSpeechTypes":["嘆詞","助詞"]},{"id":"ALL-253","text":"門口只站著「一」位客人，屋裡的人卻「一」擁而上，搶著迎接他。","answers":["數詞","副詞"],"explanation":"前者表示數目；後者修飾擁而上，表示一起。","sources":["AI 原創題庫｜NEW-POS-48"],"category":"mixed","partOfSpeechTypes":["數詞","副詞"]},{"id":"ALL-254","text":"他拿出三「張」照片，又「張」開雙臂，向我們描述拍照時的景象。","answers":["量詞","動詞"],"explanation":"前者計算照片的數量；後者表示伸展、打開。","sources":["AI 原創題庫｜NEW-POS-49"],"category":"mixed","partOfSpeechTypes":["量詞","動詞"]},{"id":"ALL-255","text":"郵差送來兩「封」信，一封「封」得很緊，另一封卻沒有封口。","answers":["量詞","動詞"],"explanation":"前者計算信件；後者表示封閉、黏合信封。","sources":["AI 原創題庫｜NEW-POS-50"],"category":"mixed","partOfSpeechTypes":["量詞","動詞"]},{"id":"ALL-256","text":"這卷古書是我的「寶貝」，所以我一直很「寶貝」它。","answers":["名詞","動詞"],"explanation":"前一個「寶貝」指珍愛的物品；後一個表示珍愛、愛惜，後面接著「它」。","sources":["穿越遊戲原第2題｜NEW-POS-01"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-259","text":"這些記錄能「證明」他的身分，但我們還需要一份書面「證明」。","answers":["動詞","名詞"],"explanation":"前者表示以證據說明；後者指證明文件。","sources":["穿越遊戲原第22題｜NEW-POS-22"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-260","text":"她的「理想」是修復古書，如今的修復成果也十分「理想」。","answers":["名詞","形容詞"],"explanation":"前者指志向；後者描述成果令人滿意。","sources":["穿越遊戲原第31題｜NEW-POS-29"],"category":"mixed","partOfSpeechTypes":["名詞","形容詞"]},{"id":"ALL-261","text":"他的態度十分「認真」，也總是「認真」地修補每一頁書。","answers":["形容詞","副詞"],"explanation":"前者描述態度；後者修飾「修補」的動作。本遊戲依基測常用的句中功能分類，後者列為副詞。","sources":["穿越遊戲原第34題｜NEW-POS-33"],"category":"mixed","partOfSpeechTypes":["形容詞","副詞"]},{"id":"ALL-262","text":"他珍惜得來不易的「自由」，也尊重我「自由」地作出決定。","answers":["名詞","副詞"],"explanation":"前者指權利或狀態；後者修飾作出決定。依本遊戲採用的句中功能分類，後者列為副詞。","sources":["穿越遊戲原第43題｜NEW-POS-38"],"category":"mixed","partOfSpeechTypes":["名詞","副詞"]},{"id":"ALL-265","text":"小文聽到有人喚她，臉就「紅」了起來。","answers":["動詞"],"explanation":"「紅了起來」陳述臉色發生變化。","sources":["新增詞類備課完整版｜詞性運用"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-267","text":"「把」酒喝完了。","answers":["介詞"],"explanation":"「把」引介被處置的對象「酒」，主要動作是喝。","sources":["新增詞類備課完整版｜詞性運用"],"category":"single","partOfSpeechTypes":["介詞"]},{"id":"ALL-268","text":"她有一張「蘋果」臉。","answers":["形容詞"],"explanation":"依教材句中修飾功能分類：「蘋果」修飾名詞「臉」。","sources":["新增詞類備課完整版｜詞性運用"],"category":"single","partOfSpeechTypes":["形容詞"]},{"id":"ALL-272","text":"無論快樂或悲傷，好朋友隨時都會在你的「左右」。","answers":["名詞"],"explanation":"「左右」指身邊的位置，是方位名詞。","sources":["新增詞類備課完整版｜詞性運用"],"category":"single","partOfSpeechTypes":["名詞"]},{"id":"ALL-273","text":"一個有主見的人不易被他人的意見所「左右」。","answers":["動詞"],"explanation":"「左右」表示影響、支配。","sources":["新增詞類備課完整版｜詞性運用"],"category":"single","partOfSpeechTypes":["動詞"]},{"id":"ALL-274","text":"他很「寶貝」自己的「寶貝」。","answers":["動詞","名詞"],"explanation":"前者表示珍愛；後者指珍愛的人或物。","sources":["新增詞類備課完整版｜詞性運用"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-276","text":"本文選「自」論語；公亦「以」此自矜。","answers":["介詞","介詞"],"explanation":"「自」引介出處；「以」引介憑藉。","sources":["新增詞類備課完整版｜詞類介紹"],"category":"single","partOfSpeechTypes":["介詞"]},{"id":"ALL-278","text":"他們「在」夏季鳴唱。","answers":["介詞"],"explanation":"「在」引介鳴唱的時間。","sources":["新增詞類備課完整版｜詞類介紹"],"category":"single","partOfSpeechTypes":["介詞"]},{"id":"ALL-282","text":"與朋友交而不信「乎」？","answers":["助詞"],"explanation":"「乎」位於句末，表示疑問語氣。","sources":["新增詞類習作｜P20 詞性練習"],"category":"single","partOfSpeechTypes":["助詞"]},{"id":"ALL-284","text":"百鳥豈無母，爾「獨」哀怨深？","answers":["副詞"],"explanation":"「獨」表示唯獨，修飾後面的陳述。","sources":["新增詞類習作｜P20 詞性練習"],"category":"single","partOfSpeechTypes":["副詞"]},{"id":"ALL-287","text":"羊隊「和」牛群告別了田野回家了。","answers":["連詞"],"explanation":"「和」連接並列的羊隊與牛群。","sources":["新增詞類習作｜P20 詞性練習"],"category":"single","partOfSpeechTypes":["連詞"]},{"id":"ALL-288","text":"「水」「落」「石」「出」","answers":["名詞","動詞","名詞","動詞"],"explanation":"依教材詞性結構：名詞＋動詞＋名詞＋動詞；依序判讀四字的句中功能。","sources":["新增詞類習作｜P20 成語詞性配對"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-289","text":"「明」「察」「暗」「訪」","answers":["副詞","動詞","副詞","動詞"],"explanation":"依教材詞性結構：副詞＋動詞＋副詞＋動詞；依序判讀四字的句中功能。","sources":["新增詞類習作｜P20 成語詞性配對"],"category":"mixed","partOfSpeechTypes":["副詞","動詞"]},{"id":"ALL-290","text":"「高」「談」「闊」「論」","answers":["副詞","動詞","副詞","動詞"],"explanation":"依教材詞性結構：副詞＋動詞＋副詞＋動詞；依序判讀四字的句中功能。","sources":["新增詞類習作｜P20 成語詞性配對"],"category":"mixed","partOfSpeechTypes":["副詞","動詞"]},{"id":"ALL-291","text":"「去」「蕪」「存」「菁」","answers":["動詞","名詞","動詞","名詞"],"explanation":"依教材詞性結構：動詞＋名詞＋動詞＋名詞；依序判讀四字的句中功能。","sources":["新增詞類習作｜P20 成語詞性配對"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-292","text":"「飲」「水」「思」「源」","answers":["動詞","名詞","動詞","名詞"],"explanation":"依教材詞性結構：動詞＋名詞＋動詞＋名詞；依序判讀四字的句中功能。","sources":["新增詞類習作｜P20 成語詞性配對"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-294","text":"「碧」「海」「藍」「天」","answers":["形容詞","名詞","形容詞","名詞"],"explanation":"依教材詞性結構：形容詞＋名詞＋形容詞＋名詞；依序判讀四字的句中功能。","sources":["新增詞類習作｜P20 成語詞性配對"],"category":"mixed","partOfSpeechTypes":["形容詞","名詞"]},{"id":"ALL-295","text":"「心」「直」「口」「快」","answers":["名詞","形容詞","名詞","形容詞"],"explanation":"依教材詞性結構：名詞＋形容詞＋名詞＋形容詞；依序判讀四字的句中功能。","sources":["新增詞類習作｜P20 成語詞性配對"],"category":"mixed","partOfSpeechTypes":["名詞","形容詞"]},{"id":"ALL-296","text":"「山」「明」「水」「秀」","answers":["名詞","形容詞","名詞","形容詞"],"explanation":"依教材詞性結構：名詞＋形容詞＋名詞＋形容詞；依序判讀四字的句中功能。","sources":["新增詞類習作｜P20 成語詞性配對"],"category":"mixed","partOfSpeechTypes":["名詞","形容詞"]},{"id":"ALL-297","text":"阿奇正為數學題「傷」腦筋，一不留神撞到桌角而受「傷」。","answers":["動詞","名詞"],"explanation":"前者表示耗費心神；後者指受損的狀態。","sources":["新增詞類習作｜P21 選擇題"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-299","text":"郭將軍率兵「平」定戰亂，天下終於太「平」，百姓可恢復過往安居樂業的生活。","answers":["動詞","形容詞"],"explanation":"前者表示平定的動作；後者表示安定的狀態。","sources":["新增詞類習作｜P21 選擇題"],"category":"mixed","partOfSpeechTypes":["動詞","形容詞"]},{"id":"ALL-300","text":"病重的母親請人代筆寫「信」，要讓遠在異鄉求學的兒子放心，深「信」家中一切安好。","answers":["名詞","動詞"],"explanation":"前者指書信；後者表示相信。","sources":["新增詞類習作｜P21 選擇題"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-302","text":"「哭」，是不能解決問題的，請別「哭」了。","answers":["名詞","動詞"],"explanation":"前者把「哭」當成一種行為來談論；後者表示哭泣的動作，受「別」限制。","sources":["20261123123533_115學年度國中國文測驗解析卷(全).docx｜原選項改為詞性填充"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"ALL-303","text":"你今天所買的這部「新」電腦，是「新」研發的。","answers":["形容詞","副詞"],"explanation":"前者修飾名詞「電腦」；後者表示新近，修飾動詞「研發」。","sources":["20261123123533_115學年度國中國文測驗解析卷(全).docx｜原選項改為詞性填充"],"category":"mixed","partOfSpeechTypes":["形容詞","副詞"]},{"id":"ALL-304","text":"「傳說」這則「傳說」產生的年代很久遠，至少已經有一千多年了。","answers":["動詞","名詞"],"explanation":"前者表示人們如此傳述；後者指流傳的故事，可以用「這則」限定。","sources":["20261123123533_115學年度國中國文測驗解析卷(全).docx｜原選項改為詞性填充"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-305","text":"「蜿蜒」的山徑旁，有許多小路「蜿蜒」著。","answers":["形容詞","動詞"],"explanation":"前者修飾名詞「山徑」；後者陳述小路曲折延伸的情形。","sources":["詞性-解析卷全.docx｜原選項改為詞性填充"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"ALL-306","text":"她與他「邂逅」於秋日異鄉，這樣的「邂逅」真是美麗啊。","answers":["動詞","名詞"],"explanation":"前者表示偶然相遇；後者指這一次相遇的事件。","sources":["詞性-解析卷全.docx｜原選項改為詞性填充"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"ALL-307","text":"所謂「時尚」的穿搭，就是要能穿出自己的獨特「時尚」。","answers":["形容詞","名詞"],"explanation":"前者修飾名詞「穿搭」；後者指個人的流行風格。","sources":["詞性-解析卷全.docx｜原選項改為詞性填充"],"category":"mixed","partOfSpeechTypes":["形容詞","名詞"]},{"id":"ALL-309","text":"「疾」風勁草／大聲「疾」呼。","answers":["形容詞","副詞"],"explanation":"前者表示猛烈，修飾名詞「風」；後者表示急切，修飾動詞「呼」。","sources":["詞性-解析卷全.docx｜原選項改為詞性填充"],"category":"mixed","partOfSpeechTypes":["形容詞","副詞"]},{"id":"A-01","text":"王建民平日「苦練」的精神令人敬佩／我們不要忽略了絢麗背後更可貴的「苦練」。","answers":["形容詞","名詞"],"explanation":"前者依教材修飾功能分類，修飾「精神」；後者指刻苦練習這件事。","sources":["20261123123533_115學年度國中國文測驗解析卷(全).docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["形容詞","名詞"]},{"id":"A-02","text":"我每天上朝都帶著「筆記」本，「筆記」大臣們所說的建議與提醒。","answers":["形容詞","動詞"],"explanation":"前者依教材分類修飾「本」；後者表示用筆記錄大臣的建議。","sources":["20261123123533_115學年度國中國文測驗解析卷(全).docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"A-03","text":"飯後一根「長壽」，生命不會因此變「長壽」。","answers":["名詞","形容詞"],"explanation":"前者指香菸品牌名稱；後者形容壽命長。","sources":["20261123123533_115學年度國中國文測驗解析卷(全).docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["名詞","形容詞"]},{"id":"A-04","text":"「寫作」文章已成他的最愛，因為他能從「寫作」的世界中獲得成就感。","answers":["動詞","形容詞"],"explanation":"前者表示撰寫文章；後者依教材修飾功能分類，修飾「世界」。","sources":["20261123123533_115學年度國中國文測驗解析卷(全).docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["動詞","形容詞"]},{"id":"A-05","text":"這問題很「單純」，稍加思考就能解決／我「單純」想與你做個朋友，不知道你能否接受。","answers":["形容詞","副詞"],"explanation":"前者描述問題的性質；後者表示只是、僅僅，修飾「想」。","sources":["20261123_國中國文_01_題目與詳解.docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["形容詞","副詞"]},{"id":"A-06","text":"他們依靠著彼此，「興奮」的說著未來規畫／得到大獎的他，「興奮」的心情全寫在臉上。","answers":["副詞","形容詞"],"explanation":"前者修飾動詞「說」；後者修飾名詞「心情」。","sources":["20261123_國中國文_01_題目與詳解.docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["副詞","形容詞"]},{"id":"A-08","text":"時常「批評」別人的你，最該學的是好好接受別人的「批評」。","answers":["動詞","名詞"],"explanation":"前者表示評論別人的動作；後者是「接受」的對象。","sources":["詞性-解析卷全.docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"A-09","text":"不「菸酒」的男人和「菸酒」不離手的男人有何差別？","answers":["動詞","名詞"],"explanation":"前者表示抽菸、喝酒；後者指香菸與酒。","sources":["詞性-解析卷全.docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["動詞","名詞"]},{"id":"A-10","text":"草叢中出現流螢，「婆娑」在我們周圍／「婆娑」之洋，美麗之島。","answers":["動詞","形容詞"],"explanation":"前者陳述飛舞的動態；後者依教材分類描述海洋的樣貌。","sources":["詞性-解析卷全.docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["動詞","形容詞"]},{"id":"A-11","text":"「白」髮吟／「白」了少年頭。","answers":["形容詞","動詞"],"explanation":"前者修飾名詞「髮」；後者表示使頭髮變白。","sources":["詞性-解析卷全.docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"A-12","text":"「火」輪子／熱情如「火」。","answers":["形容詞","名詞"],"explanation":"前者依教材修飾功能分類，修飾「輪子」；後者指火焰，是比喻的對象。","sources":["詞性-解析卷全.docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["形容詞","名詞"]},{"id":"A-17","text":"廷尉奏「當」／而廷尉乃「當」之罰金。","answers":["名詞","動詞"],"explanation":"前者指判決結果，是「奏」的內容；後者表示判處罰金的動作。","sources":["20261123123533_115學年度國中國文測驗解析卷(全).docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"A-19","text":"通風報「信」／「信」口開河。","answers":["名詞","副詞"],"explanation":"前者指消息；後者表示隨意，限制後面的說話行為。","sources":["詞性-解析卷全.docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["名詞","副詞"]},{"id":"A-20","text":"他的技術真是登峰造「極」／要革除一種惡習慣，便須下「極」大的決心。","answers":["名詞","副詞"],"explanation":"前者指最高點、極點；後者修飾形容詞「大」，表示程度。","sources":["詞性-解析卷全.docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["名詞","副詞"]},{"id":"A-22","text":"「哇」！這件衣服真漂亮／你今天過得好「嗎」？","answers":["嘆詞","助詞"],"explanation":"「哇」獨立表達驚嘆；「嗎」附在句末表示疑問。","sources":["20261123_國中國文_01_題目與詳解.docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["嘆詞","助詞"]},{"id":"A-23","text":"河水十分「混濁」／他「再三」澄清自己與醜聞案無關。","answers":["形容詞","副詞"],"explanation":"前者描述河水的狀態；後者表示反覆多次，修飾「澄清」。","sources":["20261123_國中國文_01_題目與詳解.docx｜附件選項摘錄／配對改編"],"category":"mixed","partOfSpeechTypes":["形容詞","副詞"]},{"id":"B-01","text":"桌上的「魚肉」已經煮熟，那名惡吏卻還在「魚肉」鄉民。","answers":["名詞","動詞"],"explanation":"前者指魚的肉；後者表示欺凌、宰割百姓。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"B-03","text":"師傅買了一桶「漆」，準備把舊木門「漆」成藍色。","answers":["名詞","動詞"],"explanation":"前者指油漆材料；後者表示塗上油漆。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"B-04","text":"這把「鎖」已經生鏽，卻還能牢牢「鎖」住大門。","answers":["名詞","動詞"],"explanation":"前者指鎖具；後者表示用鎖關住。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"B-05","text":"他拿起一把「鋸」，慢慢地「鋸」開木板。","answers":["名詞","動詞"],"explanation":"前者指鋸子；後者表示用鋸子切割。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"B-06","text":"漁夫補好破掉的「網」，明早就能出海「網」魚。","answers":["名詞","動詞"],"explanation":"前者指捕魚的網具；後者表示用網捕捉魚。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"B-07","text":"將軍放下手中的「鞭」，不忍再「鞭」打那匹受傷的馬。","answers":["名詞","動詞"],"explanation":"前者指鞭子；後者表示用鞭子抽打。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"B-10","text":"她準備好表演用的「武裝」，再用勇氣「武裝」自己。","answers":["名詞","動詞"],"explanation":"前者指裝備；後者表示裝備自己、使自己具備力量。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"B-11","text":"這份禮物的「包裝」很漂亮，卻不能只靠外表「包裝」自己的能力。","answers":["名詞","動詞"],"explanation":"前者指包裹的形式；後者表示修飾、塑造形象。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"B-12","text":"衣領上的「標籤」可以剪掉，別人卻不該隨意「標籤」一個人。","answers":["名詞","動詞"],"explanation":"前者指衣領上的標示物；後者表示替人貼上固定評價。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["名詞","動詞"]},{"id":"B-14","text":"河岸原本不「綠」，春風一吹，便「綠」了整片原野。","answers":["形容詞","動詞"],"explanation":"前者描述顏色；後者表示使原野變綠。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"B-15","text":"祖父的頭髮已經很「白」，歲月也「白」了他的眉。","answers":["形容詞","動詞"],"explanation":"前者描述頭髮的顏色；後者表示使眉毛變白。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"B-16","text":"這杯茶很「暖」，也「暖」了旅人疲憊的心。","answers":["形容詞","動詞"],"explanation":"前者形容茶的溫度；後者表示使旅人的心感到溫暖。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"B-17","text":"箱子裡已經很「空」，他仍把最後一格也「空」了出來。","answers":["形容詞","動詞"],"explanation":"前者形容箱子裡沒有東西；後者讀ㄎㄨㄥˋ，表示騰出空間。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"B-18","text":"他的知識很「豐富」，閱讀又「豐富」了他的人生。","answers":["形容詞","動詞"],"explanation":"前者形容知識的充足；後者表示使人生更有內容。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"B-19","text":"這一天過得很「充實」，他也用讀書「充實」自己。","answers":["形容詞","動詞"],"explanation":"前者形容一天的生活狀態；後者表示增進自己的學識、能力。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"B-21","text":"這條路很「平」，工人又把旁邊的坑洞「平」了。","answers":["形容詞","動詞"],"explanation":"前者形容路面平整；後者表示填平、使坑洞平整。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"B-23","text":"他的回答很「明白」，卻沒能「明白」我的苦心。","answers":["形容詞","動詞"],"explanation":"前者形容回答清楚；後者表示理解苦心。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"B-24","text":"這個安排很「方便」，也確實「方便」了遠道而來的旅客。","answers":["形容詞","動詞"],"explanation":"前者形容安排便利；後者表示使旅客得到便利。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"B-25","text":"他的笑容十分「溫柔」，也「溫柔」了我原本尖銳的語氣。","answers":["形容詞","動詞"],"explanation":"前者形容笑容的特質；後者表示使尖銳的語氣變得溫柔。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"B-28","text":"山裡的空氣很「清新」，一場雨又「清新」了整座山城。","answers":["形容詞","動詞"],"explanation":"前者形容空氣的特質；後者表示使山城變得清新。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]},{"id":"B-30","text":"這段人生並不「完美」，卻因彼此扶持而「完美」了這場相遇。","answers":["形容詞","動詞"],"explanation":"前者描述人生的性質；後者表示使這場相遇變得完美。","sources":["原創比較例句｜整理者設計，非附件逐字原題"],"category":"mixed","partOfSpeechTypes":["形容詞","動詞"]}],"chapters":[{"id":"case","name":"冤案・魯班巧鎖","game":"luban","count":6,"targets":1,"ability":"智力","hint":"按順序判斷詞性，抽出六根木條，找出原稿。"},{"id":"touhu","name":"長安聚會・辨詞投壺","game":"touhu","count":7,"targets":1,"ability":"禮儀","hint":"從箭筒拿起箭，放開射向對應的詞性壺口。"},{"id":"river","name":"河邊相知・曲水流觴","game":"river","count":8,"targets":1,"ability":"感受力","hint":"杯子漂到正確詞性座位前的金框時，拿起杯子。"},{"id":"lantern","name":"上元之約・同心燈會","game":"lantern","count":10,"targets":2,"ability":"魅力","hint":"每題兩處皆對，點亮一區同心結。"},{"id":"observatory","name":"星河歸途・渾天儀","game":"stars","count":9,"targets":2,"ability":"體力","hint":"三題、三線索，解鎖並對準一環。三環完成開啟通道。"}],"beats":[{"id":"beat-0","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜","text":"大家好，我是今天的導覽員沈清霜。為了這次唐代書法特展，我特地換上了唐裝！"},{"id":"beat-1","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜","text":"今天帶大家看的這幅書法，寫的是崔護的〈題都城南莊〉。"},{"id":"beat-2","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"參觀學生","text":"所以這幅字也是崔護寫的嗎？"},{"id":"beat-3","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜","text":"詩是崔護寫的，這幅書法的書寫者，則是顧懷瑾。兩個名字可別記反囉。"},{"id":"beat-4","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜","text":"先看看另一張拓本。同一個字，換一種寫法，就會有不同的模樣。"},{"id":"beat-5","type":"reading","reading":"calligraphy","chapter":-1,"scene":"museum-guide"},{"id":"beat-6","type":"exam","question":"CAP115-10","chapter":-1,"scene":"museum-guide"},{"id":"beat-7","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜","text":"我們先一起讀這首詩。"},{"id":"beat-8","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜（朗讀）","text":"去年今日此門中，"},{"id":"beat-9","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜（朗讀）","text":"人面桃花相映紅。"},{"id":"beat-10","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜（朗讀）","text":"人面不知何處去，"},{"id":"beat-11","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜（朗讀）","text":"桃花依舊笑春風。"},{"id":"beat-12","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜","text":"花還在，想見的人卻不在眼前。"},{"id":"beat-13","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"參觀學生","text":"那他還能再見到對方嗎？"},{"id":"beat-14","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜","text":"讀到這裡，我也很希望他們能再見面。"},{"id":"beat-15","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜","text":"大家看這個落款……，咦？是我眼花了嗎？顧懷瑾這三個字，怎麼像水波一樣在搖動？"},{"id":"beat-16","type":"line","scene":"museum-guide","chapter":-1,"when":null,"speaker":"清霜","text":"是燈光出了問題嗎？大家先往後退一點。"},{"id":"beat-17","type":"line","scene":"museum-peach-petal-rain","chapter":-1,"when":null,"speaker":"清霜","text":"怎麼有桃花飛出來？你們還聽得到我嗎？"},{"id":"beat-18","type":"line","scene":"arrival-sky-fall","chapter":-1,"when":null,"speaker":"清霜","text":"等一下，我只是來上班的啊——！"},{"id":"beat-19","type":"line","scene":"arrival","chapter":0,"when":null,"speaker":"懷瑾","text":"別怕！我穩住你了！"},{"id":"beat-20","type":"line","scene":"arrival","chapter":0,"when":null,"speaker":"清霜","text":"你先別放手，我的腳還沒踩到地上！"},{"id":"beat-21","type":"line","scene":"arrival","chapter":0,"when":null,"speaker":"懷瑾","text":"慢一點。好，腳踩穩了，我才放手。"},{"id":"beat-22","type":"line","scene":"arrival","chapter":0,"when":null,"speaker":"清霜","text":"謝謝……請問，這裡是哪裡？"},{"id":"beat-23","type":"line","scene":"arrival","chapter":0,"when":null,"speaker":"懷瑾","text":"長安。姑娘還好嗎？"},{"id":"beat-24","type":"line","scene":"arrival","chapter":0,"when":null,"speaker":"清霜","text":"長安？那你是……"},{"id":"beat-25","type":"line","scene":"arrival","chapter":0,"when":null,"speaker":"懷瑾","text":"我姓顧，名懷瑾。"},{"id":"beat-26","type":"line","scene":"arrival","chapter":0,"when":null,"speaker":"清霜心聲","text":"顧懷瑾？居然是剛剛寫詩的書法家？還長得這麼好看……。"},{"id":"beat-27","type":"line","scene":"arrest-guards","chapter":0,"when":null,"speaker":"官兵","text":"顧懷瑾！你的文章裡有侮辱皇帝的字句，跟我們回官府！"},{"id":"beat-28","type":"line","scene":"arrest-guards","chapter":0,"when":null,"speaker":"懷瑾","text":"不可能！我交出去的文章，沒有這些話。"},{"id":"beat-29","type":"line","scene":"arrest","chapter":0,"when":null,"speaker":"清霜","text":"等一下。那份文書可以讓我看清楚嗎？"},{"id":"beat-30","type":"line","scene":"arrest","chapter":0,"when":null,"speaker":"官兵","text":"名字就在上面，還有什麼好看的？"},{"id":"beat-31","type":"line","scene":"arrest","chapter":0,"when":null,"speaker":"清霜","text":"這個字跡看起來的確很像顧懷瑾的手筆，模仿得惟妙惟肖。但是有些地方很明顯停頓，有些許墨水堆積，臨摹、仿寫的可能性很高，而起筆與收筆，也很明顯有些生硬、不自然。"},{"id":"beat-32","type":"line","scene":"arrest","chapter":0,"when":null,"speaker":"清霜","text":"有他的名字，也不能直接證明那些字是他寫的。請給我們七天查明真相。"},{"id":"beat-33","type":"line","scene":"arrest","chapter":0,"when":null,"speaker":"清霜","text":"七天之後如果還查不出來，我會親自帶他回官府。"},{"id":"beat-34","type":"line","scene":"arrest","chapter":0,"when":null,"speaker":"官兵","text":"我會把妳說的情況回報。能不能暫緩，得由大人決定。"},{"id":"beat-35","type":"line","scene":"arrest","chapter":0,"when":null,"speaker":"官兵","text":"大人核看文書後，准許暫緩拘押七天。但顧懷瑾你必須留在長安，隨時配合查案。"},{"id":"beat-36","type":"line","scene":"arrest","chapter":0,"when":null,"speaker":"懷瑾","text":"我們才剛見面，妳為何替我說話？"},{"id":"beat-37","type":"line","scene":"arrest","chapter":0,"when":null,"speaker":"清霜","text":"要怎麼跟你說呢？我覺得一位字跡娟秀的書法家一定人品高潔。"},{"id":"beat-38","type":"line","scene":"arrest","chapter":0,"when":null,"speaker":"懷瑾","text":"謝謝妳願意相信我的清白。"},{"id":"beat-39","type":"line","scene":"arrest","chapter":0,"when":null,"speaker":"清霜","text":"讓我們一起追查真相！"},{"id":"beat-40","type":"line","scene":"investigate","chapter":0,"when":null,"speaker":"懷瑾","text":"誰會想陷害我呢？"},{"id":"beat-41","type":"line","scene":"investigate","chapter":0,"when":null,"speaker":"清霜","text":"先別急。我們先弄清楚你的工作，再查那份文章經過誰的手。"},{"id":"beat-42","type":"reading","reading":"hanlin","chapter":0,"scene":"investigate"},{"id":"beat-43","type":"exam","question":"CAP115-33","chapter":0,"scene":"investigate"},{"id":"beat-44","type":"exam","question":"CAP115-34","chapter":0,"scene":"investigate"},{"id":"beat-45","type":"line","scene":"investigate","chapter":0,"when":null,"speaker":"清霜","text":"先回想一下，你寫完文章以後，交給誰了？"},{"id":"beat-46","type":"line","scene":"investigate","chapter":0,"when":null,"speaker":"懷瑾","text":"我把原稿交給一起辦事的韋承嗣核對，再由負責送文書的人送出去。"},{"id":"beat-47","type":"line","scene":"investigate","chapter":0,"when":null,"speaker":"清霜","text":"那你覺得我們可以去哪裡找線索？證明你的清白。"},{"id":"beat-48","type":"line","scene":"investigate","chapter":0,"when":null,"speaker":"懷瑾","text":"他說過文稿被燭火燒壞了，他只好重新抄一份。可是這一份抄本，內容我沒看過。"},{"id":"beat-49","type":"line","scene":"investigate","chapter":0,"when":null,"speaker":"清霜","text":"那就分頭查吧！你問送文書的人，我去核對韋承嗣的說法。晚點在這裡碰面。"},{"id":"beat-50","type":"line","scene":"investigate","chapter":0,"when":null,"speaker":"懷瑾","text":"我回來了。送文書的人只拿到封好的抄本，沒碰過原稿。同事還說，韋承嗣正在爭取接替我的工作。"},{"id":"beat-51","type":"line","scene":"investigate","chapter":0,"when":null,"speaker":"清霜","text":"他一直說原稿燒了，卻不肯說清楚重抄的經過。值得懷疑，但還不能下定論。他平常把文書放在哪裡？"},{"id":"beat-52","type":"line","scene":"investigate","chapter":0,"when":null,"speaker":"懷瑾","text":"依據我對他的瞭解，重要物品通常會放家裡的書房。我們今晚去韋府查證，看看原稿是不是真的燒了。"},{"id":"beat-53","type":"line","scene":"wei-wall","chapter":0,"when":null,"speaker":"清霜","text":"那扇還亮著燈的窗，就是書房？"},{"id":"beat-54","type":"line","scene":"wei-wall","chapter":0,"when":null,"speaker":"懷瑾","text":"是。小心腳下，我在這裡。","followup":[{"speaker":"懷瑾（低聲）","text":"踩著我的肩膀上去，先抓穩牆邊。","scene":"wall-shoulder-boost"},{"speaker":"清霜","text":"會不會太重？","scene":"wall-shoulder-boost"},{"speaker":"懷瑾","text":"不會。我扶著，妳慢慢來。","scene":"wall-shoulder-boost"},{"speaker":"清霜","text":"那你蹲穩一點喔。","scene":"wall-shoulder-boost"},{"speaker":"懷瑾","text":"好。抓到了嗎？","scene":"wall-shoulder-boost"},{"speaker":"清霜","text":"抓到了。","scene":"wall-shoulder-boost"}]},{"id":"beat-55","type":"line","scene":"wei-wall","chapter":0,"when":null,"speaker":"清霜","text":"等我站穩，你再過來。"},{"id":"beat-56","type":"skip","scene":"wei-wall","chapter":0,"when":null},{"id":"beat-57","type":"followup","scene":"wei-wall","chapter":0,"when":null,"followup":[{"speaker":"清霜（牆內，低聲）","text":"我下來了。裡面沒人，你可以過來。","scene":"wei-wall"},{"scene":"wei-wall","skip":true},{"speaker":"懷瑾","text":"看我輕鬆翻過牆。","scene":"wall-huaijin-vault"},{"scene":"wall-huaijin-vault","skip":true},{"speaker":"懷瑾（低聲）","text":"噓，先去看看書房。","scene":"wall-huaijin-vault"}]},{"id":"beat-58","type":"followup","scene":"luban-ear-whisper","chapter":0,"when":null,"followup":[{"speaker":"懷瑾（貼近耳邊，低聲）","text":"小聲一點。韋承嗣和管家就在裡面。","scene":"luban-ear-whisper"},{"speaker":"清霜（低聲）","text":"他們好像在說文書的事。","scene":"luban-ear-whisper"},{"speaker":"懷瑾（低聲）","text":"先聽清楚，別讓他們發現。","scene":"luban-ear-whisper"},{"speaker":"清霜（低聲）","text":"嗯……我知道了。","scene":"luban-ear-whisper"}]},{"id":"beat-59","type":"line","scene":"wei-steward-conspiracy","chapter":0,"when":null,"speaker":"韋承嗣","text":"原稿先收好，我還要拿它再偽造另一封信，徹底讓顧懷瑾翻不了身。"},{"id":"beat-60","type":"line","scene":"wei-steward-conspiracy","chapter":0,"when":null,"speaker":"管家","text":"是，我會鎖好。"},{"id":"beat-61","type":"line","scene":"luban-ear-whisper","chapter":0,"when":null,"speaker":"清霜（低聲）","text":"幸好原稿還在。我們得在今晚找到它。"},{"id":"beat-62","type":"line","scene":"luban-ear-whisper","chapter":0,"when":null,"speaker":"懷瑾（低聲）","text":"先別急，等他們離開再進去。"},{"id":"beat-63","type":"line","scene":"study-outside-clear","chapter":0,"when":null,"speaker":"懷瑾（低聲）","text":"腳步聲走遠了。我先看外面，妳跟著我進去。"},{"id":"beat-64","type":"line","scene":"luban","chapter":0,"when":null,"speaker":"清霜","text":"靠椅子這一側，桌緣下面有一道縫。這裡應該有暗格。"},{"id":"beat-65","type":"line","scene":"luban","chapter":0,"when":null,"speaker":"清霜","text":"咦？這是魯班鎖，又稱孔明鎖，是一種三軸組合的積木，以「六根型」最流行。讓我來試試看！"},{"id":"beat-66","type":"line","scene":"luban","chapter":0,"when":null,"speaker":"懷瑾","text":"六根木條互相卡住，得照順序拆開。"},{"id":"beat-67","type":"line","scene":"luban","chapter":0,"when":null,"speaker":"清霜","text":"每根木條上都有一個詞性，依據題目的詞性答案，抽取對應的木條，六根木條都抽掉才能解開魯班鎖。"},{"id":"beat-68","type":"line","scene":"luban","chapter":0,"when":null,"speaker":"懷瑾","text":"妳看題目，我幫妳留意外面的動靜。"},{"id":"beat-69","type":"explore","scene":"luban","chapter":0,"when":null,"game":"luban","hotspots":[{"x":28,"y":39,"label":"觀察書櫃","text":"清霜：「書櫃上只有書……懷瑾，桌緣下面的木紋好像接不起來。你也來看看。」"},{"x":47,"y":58,"label":"查看椅子側的暗抽屜","start":true}]},{"id":"beat-70","type":"game","scene":"luban","chapter":0,"when":null,"game":"luban"},{"id":"beat-71","type":"line","scene":"luban-open","chapter":0,"when":null,"speaker":"清霜","text":"最後一根也抽出來了！懷瑾，你看，暗抽屜打開了。"},{"id":"beat-72","type":"line","scene":"luban-open","chapter":0,"when":null,"speaker":"清霜","text":"裡面有一卷文書！讓我們打開看看。"},{"id":"beat-73","type":"line","scene":"recognize-original-scroll","chapter":0,"when":null,"speaker":"懷瑾","text":"這是我的筆跡。原來那份文章，根本沒有被燒掉。"},{"id":"beat-74","type":"line","scene":"recognize-original-scroll","chapter":0,"when":null,"speaker":"清霜","text":"那些侮辱皇帝的字句呢？"},{"id":"beat-75","type":"line","scene":"recognize-original-scroll","chapter":0,"when":null,"speaker":"懷瑾","text":"我的原稿裡沒有那些話。有人模仿我的筆跡，另外寫了一份，還加進了侮辱皇帝的內容。"},{"id":"beat-76","type":"line","scene":"recognize-original-scroll","chapter":0,"when":null,"speaker":"清霜","text":"那就把原稿帶回官府，和那份仿寫的文章比對。"},{"id":"beat-77","type":"line","scene":"court","chapter":0,"when":null,"speaker":"御史","text":"兩份文書的內容確實不同。原稿上的字句，沒有侮辱皇帝。"},{"id":"beat-78","type":"line","scene":"court","chapter":0,"when":null,"speaker":"清霜","text":"韋承嗣，你說原稿燒掉了，為什麼它還藏在你的書桌裡？"},{"id":"beat-79","type":"line","scene":"court","chapter":0,"when":null,"speaker":"韋承嗣","text":"我……原稿是我藏的。"},{"id":"beat-80","type":"line","scene":"court","chapter":0,"when":null,"speaker":"韋承嗣","text":"明明一起辦事，大家卻只稱讚他。我一時不甘心，才模仿他的筆跡另寫一份，把侮辱皇帝的話寫了進去。"},{"id":"beat-81","type":"line","scene":"censorate-official","chapter":0,"when":null,"speaker":"御史","text":"此事另行查辦。顧懷瑾的嫌疑已經洗清。"},{"id":"beat-82","type":"line","scene":"court","chapter":0,"when":null,"speaker":"清霜","text":"還好來得及找回原稿。這下你終於能放心了吧？"},{"id":"beat-83","type":"line","scene":"court","chapter":0,"when":null,"speaker":"懷瑾","text":"今天要是沒有妳，我恐怕還說不清楚。"},{"id":"beat-84","type":"line","scene":"court","chapter":0,"when":null,"speaker":"清霜","text":"原稿是我們一起找到的。"},{"id":"beat-85","type":"line","scene":"court","chapter":0,"when":null,"speaker":"懷瑾","text":"那就讓我好好謝謝妳。今天能平安走出官府，真的多虧有妳。"},{"id":"beat-86","type":"choice","scene":"court","chapter":0,"when":null,"choice":{"id":"case-thanks","prompt":"清霜怎麼回答？","options":[{"id":"A","label":"以後遇到事情，我們也一起想辦法。","response":[{"speaker":"懷瑾","text":"好。這次有妳在，我才沒有慌了手腳。"},{"speaker":"清霜","text":"那下次也別一個人硬撐。"},{"speaker":"程千里","text":"懷瑾，今天下午的聚會別忘了來參加。","scene":"friends-invitation"},{"speaker":"常依然","text":"聽說事情查清楚了，我們總算放心了！這位姑娘是？","scene":"friends-invitation"},{"speaker":"懷瑾","text":"她是沈清霜，這次多虧她幫忙。清霜，這兩位是我的朋友程千里、常依然。","scene":"friends-invitation"},{"speaker":"清霜","text":"你們好！我剛到長安，還沒參加過這裡的聚會。","scene":"friends-invitation"},{"speaker":"程千里","text":"那就一起來吧！下午在庭園碰面，我們還準備了投壺。","scene":"friends-invitation"},{"speaker":"清霜","text":"投壺？我沒玩過，可以先教我嗎？","scene":"friends-invitation"},{"speaker":"懷瑾","text":"當然。我們先去吃點東西，下午再一起過去。我教妳。","scene":"friends-invitation"},{"speaker":"常依然","text":"說好了，下午見！","scene":"friends-invitation"}],"affection":2,"flag":"solvedTogether","callback":"司天臺最終選擇時，懷瑾說：「就像妳說的，我們一起想辦法。」"},{"id":"B","label":"不用客氣，下次帶我逛逛長安就好。","response":[{"speaker":"懷瑾","text":"好。我知道一個聚會，有吃的，也有妳可能沒玩過的遊戲。"},{"speaker":"程千里","text":"懷瑾，今天下午的聚會別忘了來參加。","scene":"friends-invitation"},{"speaker":"常依然","text":"聽說事情查清楚了，我們總算放心了！這位姑娘是？","scene":"friends-invitation"},{"speaker":"懷瑾","text":"她是沈清霜，這次多虧她幫忙。清霜，這兩位是我的朋友程千里、常依然。","scene":"friends-invitation"},{"speaker":"清霜","text":"你們好！我剛到長安，還沒參加過這裡的聚會。","scene":"friends-invitation"},{"speaker":"程千里","text":"那就一起來吧！下午在庭園碰面，我們還準備了投壺。","scene":"friends-invitation"},{"speaker":"清霜","text":"投壺？我沒玩過，可以先教我嗎？","scene":"friends-invitation"},{"speaker":"懷瑾","text":"當然。我們先去吃點東西，下午再一起過去。我教妳。","scene":"friends-invitation"},{"speaker":"常依然","text":"說好了，下午見！","scene":"friends-invitation"}],"affection":1,"flag":"walkChangan","callback":"上元燈會開場，懷瑾說：「答應陪妳逛長安，今晚這一站可別漏了。」"}],"awardOnce":true,"type":"affection-dialogue","scored":true,"maxAffection":2,"minAffection":1}},{"id":"beat-87","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"懷瑾","text":"先看朋友們示範四箭一局的投壺比賽，我們來幫忙記分。"},{"id":"beat-88","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"清霜","text":"好！看懂規則，再換我投。"},{"id":"beat-89","type":"reading","reading":"touhu","chapter":1,"scene":"touhu-intro"},{"id":"beat-90","type":"exam","question":"CAP115-35","chapter":1,"scene":"touhu-intro"},{"id":"beat-91","type":"exam","question":"CAP115-36","chapter":1,"scene":"touhu-intro"},{"id":"beat-92","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"懷瑾","text":"規則看懂了吧？換我們試試。壺就在地上，箭放在旁邊的箭筒裡。"},{"id":"beat-93","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"清霜","text":"這是要把箭丟進壺裡嗎？我還沒玩過。"},{"id":"beat-94","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"懷瑾","text":"對，這叫投壺。用手把箭投進壺口，投中的人就得分。"},{"id":"beat-95","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"清霜","text":"我可以試試看嗎？"},{"id":"beat-96","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"懷瑾","text":"先從箭筒拿一支。手再抬高一點，丟的時候要穩！"},{"id":"beat-97","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"清霜","text":"這樣如何？"},{"id":"beat-98","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"懷瑾","text":"嗯，這次一定能成功。"},{"id":"beat-99","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"懷瑾","text":"投進去了！妳第一次玩就投得這麼準。"},{"id":"beat-100","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"清霜","text":"這跟投籃差不多嘛，這球算三分！"},{"id":"beat-101","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"懷瑾","text":"投籃？我們剛才投的是箭。"},{"id":"beat-102","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"清霜","text":"呃……是我家鄉另一種遊戲。先幫我記分！"},{"id":"beat-103","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"清霜","text":"還是我來記分吧。你看，寫成「1、2、3」，一下就記好了。"},{"id":"beat-104","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"懷瑾","text":"這三個記號是什麼密文？"},{"id":"beat-105","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"清霜","text":"不是密文，是記數字的方法。這樣寫比較快。"},{"id":"beat-106","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"懷瑾","text":"妳知道古物和機關，卻又常說我沒聽過的事。妳的家鄉，真讓人好奇。"},{"id":"beat-107","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"清霜","text":"先讓我贏完這一局，再慢慢說，好不好？"},{"id":"beat-108","type":"line","scene":"touhu-intro","chapter":1,"when":null,"speaker":"懷瑾","text":"好，我等妳。"},{"id":"beat-109","type":"line","scene":"touhu-quiz","chapter":1,"when":null,"speaker":"懷瑾","text":"這四個壺口分別是名詞、動詞、形容詞和副詞。"},{"id":"beat-110","type":"line","scene":"touhu-quiz","chapter":1,"when":null,"speaker":"清霜","text":"每題只判斷一個詞，再把一支箭投進對應的壺口，對嗎？"},{"id":"beat-111","type":"line","scene":"touhu-quiz","chapter":1,"when":null,"speaker":"懷瑾","text":"對。一共有七題，每題二十秒。從箭筒拿起箭，移到壺口上方，再放開。"},{"id":"beat-112","type":"line","scene":"touhu-quiz","chapter":1,"when":null,"speaker":"清霜","text":"知道了。這次我記得，投的是箭。"},{"id":"beat-113","type":"explore","scene":"touhu-quiz","chapter":1,"when":null,"game":"touhu","hotspots":[{"x":29,"y":72,"label":"拿起箭筒","start":true}]},{"id":"beat-114","type":"game","scene":"touhu-quiz","chapter":1,"when":null,"game":"touhu"},{"id":"beat-115","type":"line","scene":"touhu-quiz","chapter":1,"when":null,"speaker":"清霜","text":"剛開始還不會拿箭，現在總算有點樣子了。"},{"id":"beat-116","type":"line","scene":"touhu-quiz","chapter":1,"when":null,"speaker":"懷瑾","text":"妳上手得很快。"},{"id":"beat-117","type":"line","scene":"touhu-quiz","chapter":1,"when":null,"speaker":"清霜","text":"也多虧你肯一遍一遍教。"},{"id":"beat-118","type":"line","scene":"touhu-quiz","chapter":1,"when":null,"speaker":"懷瑾","text":"那下次還想玩嗎？"},{"id":"beat-119","type":"choice","scene":"touhu-quiz","chapter":1,"when":null,"choice":{"id":"touhu-next","prompt":"清霜怎麼回答？","options":[{"id":"A","label":"想，你再教我一次，我還沒抓到訣竅。","response":[{"speaker":"懷瑾","text":"好。先練穩，再試遠一點的壺口。"},{"speaker":"懷瑾","text":"投了這麼多箭，手痠了吧？先到旁邊休息一下。","scene":"garden-rest"},{"speaker":"清霜","text":"有一點。不過今天很好玩，謝謝你帶我來。","scene":"garden-rest"},{"speaker":"懷瑾","text":"剛才說好要教我的「1、2、3」，現在可以教了吧？","scene":"garden-rest"},{"speaker":"清霜","text":"桌上的毛筆借我一下。","scene":"garden-rest"},{"speaker":"懷瑾","text":"我拿給妳。","scene":"garden-rest"},{"speaker":"清霜（指尖相觸）","text":"啊……","scene":"brush-fingertips"},{"speaker":"懷瑾","text":"抱歉，沒注意妳也伸手了。","scene":"brush-fingertips"},{"speaker":"清霜（縮回手）","text":"沒事，你先拿吧。","scene":"brush-fingertips"},{"speaker":"懷瑾","text":"我是要拿給妳的。","scene":"brush-fingertips"},{"speaker":"清霜","text":"喔……對。那、那我來寫。","scene":"brush-fingertips"},{"speaker":"懷瑾（輕咳）","text":"好，紙在這裡。妳慢慢寫。","scene":"brush-fingertips"},{"speaker":"清霜","text":"可以啊。這是一，這是二，這是三。這樣記分，是不是快多了？","scene":"garden-rest"},{"speaker":"懷瑾","text":"確實好記。妳家鄉的人，都這樣寫？","scene":"garden-rest"},{"speaker":"清霜","text":"對。我以前還會跟家人一起看球賽……說著說著，突然有點想家了。","scene":"garden-rest"},{"speaker":"懷瑾","text":"妳想說，我就陪妳聊。不想說，也沒關係。","scene":"garden-rest"},{"speaker":"清霜","text":"你不會覺得，我一直不說來歷，很可疑嗎？","scene":"garden-rest"},{"speaker":"懷瑾","text":"妳幫我查案時那麼認真，我都看見了。我想先聽妳怎麼說。","scene":"garden-rest"},{"speaker":"懷瑾","text":"天色不早了。明天聚會前，我們再慢慢聊？","scene":"garden-rest"},{"speaker":"清霜","text":"好，明天見。","scene":"garden-rest"}],"affection":1,"flag":"learnAgain","callback":"回現代番外由清霜教懷瑾寫數字；留唐番外由懷瑾繼續教清霜寫字。"},{"id":"B","label":"想，下次還要和你一起玩。換我教你看數字！","response":[{"speaker":"懷瑾","text":"好。那三個記號，我還等著妳教呢。"},{"speaker":"清霜","text":"說好了，下次還是你陪我。"},{"speaker":"懷瑾","text":"投了這麼多箭，手痠了吧？先到旁邊休息一下。","scene":"garden-rest"},{"speaker":"清霜","text":"有一點。不過今天很好玩，謝謝你帶我來。","scene":"garden-rest"},{"speaker":"懷瑾","text":"剛才說好要教我的「1、2、3」，現在可以教了吧？","scene":"garden-rest"},{"speaker":"清霜","text":"桌上的毛筆借我一下。","scene":"garden-rest"},{"speaker":"懷瑾" "scene":"future-truth","chapter":2,"when":null,"speaker":"懷瑾","text":"我還不能全弄懂，但妳那天突然掉下來的事，我也親眼看見了。"},{"id":"beat-127","type":"line","scene":"future-truth","chapter":2,"when":null,"speaker":"清霜","text":"我也不知道怎麼解釋。我想家，卻連該往哪裡走都不知道。"},{"id":"beat-128","type":"line","scene":"future-truth","chapter":2,"when":null,"speaker":"懷瑾","text":"那就一起找辦法。妳還沒回去之前，有事都可以找我。"},{"id":"beat-129","type":"line","scene":"future-truth","chapter":2,"when":null,"speaker":"清霜","text":"我本來怕你會把我當成怪人……謝謝你願意聽我說。"},{"id":"beat-130","type":"line","scene":"future-truth","chapter":2,"when":null,"speaker":"懷瑾","text":"妳還是那個願意替我查明真相的清霜。先喝口茶吧，我在這裡陪妳。","followup":[{"speaker":"常依然（遠處）","text":"懷瑾、清霜！大家在河邊等你們，要不要一起過來？","scene":"garden-rest"},{"speaker":"清霜","text":"河邊也有活動？","scene":"garden-rest"},{"speaker":"懷瑾","text":"有。沿著這條小路走過去就到了。妳想去看看，還是再休息一下？","scene":"garden-rest"},{"speaker":"清霜","text":"一起去吧。把心事說出來以後，心裡好多了。","scene":"garden-rest"},{"speaker":"懷瑾","text":"好，我陪妳慢慢走。","scene":"garden-rest"},{"speaker":"程千里","text":"你們來啦！清霜，妳就坐在懷瑾旁邊。","scene":"river-seats"},{"speaker":"清霜","text":"原來大家都坐在水邊……咦，怎麼有杯子漂過來？","scene":"river-seats"},{"speaker":"懷瑾","text":"先別急著接，我說給妳聽。這回漂的是杯子，可別再算三分了。","scene":"river-seats"}]},{"id":"beat-131","type":"line","scene":"river-seats","chapter":2,"when":null,"speaker":"懷瑾","text":"這是曲水流觴。大家坐在彎曲的水道旁，讓杯子順著水流漂。"},{"id":"beat-132","type":"line","scene":"river-seats","chapter":2,"when":null,"speaker":"清霜","text":"難怪要坐得離水這麼近。杯子裡裝的是什麼？"},{"id":"beat-133","type":"line","scene":"river-seats","chapter":2,"when":null,"speaker":"懷瑾","text":"今天準備的是茶。朋友們還把聚會改成了辨詞接杯。"},{"id":"beat-134","type":"line","scene":"river-seats","chapter":2,"when":null,"speaker":"林秀雅","text":"歡迎！我的座位代表形容詞，名字下面會寫清楚。"},{"id":"beat-135","type":"line","scene":"river-seats","chapter":2,"when":null,"speaker":"常依然","text":"我這裡是副詞。看到「常常」、「依然」這類用法，可以多想想它修飾的是什麼。"},{"id":"beat-136","type":"line","scene":"river-seats","chapter":2,"when":null,"speaker":"程千里","text":"我這席收數詞和量詞，合在「數量詞」這一站。"},{"id":"beat-137","type":"line","scene":"river-seats","chapter":2,"when":null,"speaker":"柳念君","text":"我負責代詞。判斷時，要看它在句子裡代替了誰或什麼。"},{"id":"beat-138","type":"line","scene":"river-seats","chapter":2,"when":null,"speaker":"懷瑾","text":"清霜代表名詞，我代表動詞。六個座位就到齊了。"},{"id":"beat-139","type":"line","scene":"river-seats","chapter":2,"when":null,"speaker":"清霜","text":"我會先看句子，再找對應的座位。"},{"id":"beat-140","type":"line","scene":"river-quiz","chapter":2,"when":null,"speaker":"懷瑾","text":"每題只要判斷一個詞，再看清楚對應的是哪個座位。"},{"id":"beat-141","type":"line","scene":"river-quiz","chapter":2,"when":null,"speaker":"清霜","text":"杯子漂到正確的詞性座位時，把它拿起來？"},{"id":"beat-142","type":"line","scene":"river-quiz","chapter":2,"when":null,"speaker":"懷瑾","text":"對。一共有八題，每題一只杯子，從起點漂到終點剛好二十秒。"},{"id":"beat-143","type":"line","scene":"river-quiz","chapter":2,"when":null,"speaker":"清霜","text":"那我得先看懂句子，再留意杯子到哪裡了。"},{"id":"beat-144","type":"explore","scene":"river-quiz","chapter":2,"when":null,"game":"river","hotspots":[{"x":55,"y":56,"label":"來到河邊接杯","start":true}]},{"id":"beat-145","type":"game","scene":"river-quiz","chapter":2,"when":null,"game":"river"},{"id":"beat-146","type":"line","scene":"river-quiz","chapter":2,"when":null,"speaker":"懷瑾","text":"最後一杯也接住了！妳比剛開始從容多了。","followup":[{"speaker":"懷瑾","text":"到這邊坐一下吧。朋友留了些果酒，妳想嚐一點嗎？","scene":"river-seats"},{"speaker":"清霜","text":"好，喝一小口看看。","scene":"river-seats"},{"speaker":"清霜","text":"嗯，甜甜的。","scene":"river-seats"},{"speaker":"懷瑾","text":"等一下，妳嘴角沾到了一點。我幫妳擦一下？","scene":"river-seats"},{"speaker":"清霜（輕輕點頭）","text":"嗯。","scene":"river-seats"},{"speaker":"懷瑾（用手帕輕拭）","text":"好了。","scene":"river-handkerchief"},{"speaker":"清霜（有些不好意思）","text":"謝謝……你看得好仔細。","scene":"river-handkerchief"},{"speaker":"懷瑾（有點不好意思）","text":"剛好看見了。","scene":"river-handkerchief"}]},{"id":"beat-147","type":"line","scene":"river-quiz","chapter":2,"when":null,"speaker":"懷瑾","text":"今天總算懂了一點妳的世界。"},{"id":"beat-148","type":"line","scene":"river-quiz","chapter":2,"when":null,"speaker":"清霜","text":"你聽完這些，真的不覺得我在亂說？"},{"id":"beat-149","type":"line","scene":"river-quiz","chapter":2,"when":null,"speaker":"懷瑾","text":"妳願意把心事告訴我，我會認真聽。"},{"id":"beat-150","type":"choice","scene":"river-quiz","chapter":2,"when":null,"choice":{"id":"river-trust","prompt":"清霜怎麼回答？","options":[{"id":"A","label":"你相信我，讓我覺得在這裡也有人可以依靠。","response":[{"speaker":"懷瑾","text":"有事就告訴我，我們一起想辦法。"},{"speaker":"清霜","text":"好。你的事，也可以告訴我。"}],"affection":2,"flag":"believedFuture","callback":"通道打開後，懷瑾說：「妳說的地方，真的就在眼前了。」"},{"id":"B","label":"謝謝你。換你說個小時候的故事吧？","response":[{"speaker":"懷瑾","text":"我第一次練字，字還沒寫好，兩隻手就先沾滿了墨。"},{"speaker":"清霜","text":"原來翰林學士也有這種時候。"}],"affection":1,"flag":"hisFirstBrush","callback":"生活番外出現清霜檢查懷瑾有沒有又把手沾滿墨的對話。"}],"awardOnce":true,"type":"affection-dialogue","scored":true,"maxAffection":2,"minAffection":1}},{"id":"beat-151","type":"line","scene":"lantern-arrival","chapter":3,"when":null,"speaker":"懷瑾","text":"妳來長安都快一年了，還沒看過上元節的燈吧？今晚我帶妳去。"},{"id":"beat-152","type":"line","scene":"lantern-arrival","chapter":3,"when":null,"speaker":"清霜","text":"你今天怎麼一直神神祕祕的？"},{"id":"beat-153","type":"line","scene":"lantern-arrival","chapter":3,"when":null,"speaker":"懷瑾","text":"想帶妳看一些我準備的東西。"},{"id":"beat-154","type":"line","scene":"lantern-arrival","chapter":3,"when":null,"speaker":"清霜","text":"你該不會又準備了一只壺吧？"},{"id":"beat-155","type":"line","scene":"lantern-arrival","chapter":3,"when":null,"speaker":"懷瑾","text":"這次沒有箭。先把這個送妳。"},{"id":"beat-156","type":"line","scene":"lantern-arrival","chapter":3,"when":null,"speaker":"清霜","text":"〈題都城南莊〉？是你新寫的？"},{"id":"beat-157","type":"line","scene":"lantern-arrival","chapter":3,"when":null,"speaker":"清霜","text":"又是這首詩……看到你的筆跡，我還是會想到第一次導覽它的時候。"},{"id":"beat-158","type":"line","scene":"lantern-arrival","chapter":3,"when":null,"speaker":"懷瑾","text":"妳說過，是看著這首詩來到這裡的。我再寫一次，這回送給妳。"},{"id":"beat-159","type":"line","scene":"lantern-arrival","chapter":3,"when":null,"speaker":"清霜","text":"那我要好好收著。"},{"id":"beat-160","type":"line","scene":"lantern-arrival","chapter":3,"when":null,"speaker":"懷瑾","text":"答應陪妳逛長安，今晚這一站可別漏了。","ifFlag":"walkChangan"},{"id":"beat-161","type":"line","scene":"lantern-arrival","chapter":3,"when":null,"speaker":"清霜","text":"那你得帶好路，我還想看很多地方。","ifFlag":"walkChangan"},{"id":"beat-162","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"清霜","text":"這裡的燈怎麼還沒亮？"},{"id":"beat-163","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"懷瑾","text":"一共二十乘二十個燈位，分成十區。我想和妳一起把圖案找出來。"},{"id":"beat-164","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"清霜","text":"怎麼找？"},{"id":"beat-165","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"懷瑾","text":"每一道詞性燈謎有兩個詞，兩處都判斷對，就能點亮一區。"},{"id":"beat-166","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"清霜","text":"那你先別說答案，讓我看看最後會亮出什麼。"},{"id":"beat-167","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"懷瑾","text":"好，我等妳。"},{"id":"beat-168","type":"explore","scene":"lantern-quiz","chapter":3,"when":null,"game":"lantern","hotspots":[{"x":53,"y":45,"label":"查看同心燈陣","start":true}]},{"id":"beat-169","type":"game","scene":"lantern-quiz","chapter":3,"when":null,"game":"lantern"},{"id":"beat-170","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"懷瑾","text":"全亮了。清霜，看看這些燈連成了什麼？"},{"id":"beat-171","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"清霜","text":"是同心結……這些都是你安排的？"},{"id":"beat-172","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"懷瑾","text":"是。這代表我的心意，想與妳同心。"},{"id":"beat-173","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"懷瑾","text":"我願提筆畫盡天下，許妳一世繁華。"},{"id":"beat-174","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"懷瑾","text":"期望每年燈會，都能和妳攜手共度。"},{"id":"beat-175","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"懷瑾","text":"還有一句話，我想親口告訴妳。"},{"id":"beat-176","type":"line","scene":"lantern-quiz","chapter":3,"when":null,"speaker":"懷瑾","text":"清霜，我喜歡妳。"},{"id":"beat-177","type":"choice","sc ,{"id":"beat-187","type":"line","scene":"lantern-to-stars","chapter":3,"when":null,"speaker":"清霜","text":"像我來的時候那樣？"},{"id":"beat-188","type":"line","scene":"lantern-to-stars","chapter":3,"when":null,"speaker":"懷瑾","text":"有可能。明天我們一起去看看。"},{"id":"beat-189","type":"line","scene":"lantern-to-stars","chapter":3,"when":null,"speaker":"清霜","text":"你才剛說喜歡我，就要陪我找回去的方法？"},{"id":"beat-190","type":"line","scene":"lantern-to-stars","chapter":3,"when":null,"speaker":"懷瑾","text":"我會捨不得，也想讓妳自己選。"},{"id":"beat-191","type":"line","scene":"lantern-to-stars","chapter":3,"when":null,"speaker":"清霜","text":"那明天，也一起去。","followup":[{"speaker":"清霜","text":"今天走了好多路，腿都痠了。","scene":"lantern-to-stars"},{"speaker":"懷瑾","text":"馬車在前面，我送妳回去。","scene":"lantern-to-stars"},{"speaker":"清霜","text":"總算能坐下了……這裡好暖。","scene":"carriage-drowsy"},{"speaker":"懷瑾","text":"累了就睡一會兒，到了我再叫妳。","scene":"carriage-drowsy"},{"speaker":"清霜","text":"我還想跟你說，剛才的燈……","scene":"carriage-drowsy"},{"speaker":"懷瑾","text":"嗯，我聽著。","scene":"carriage-drowsy"},{"speaker":"清霜（打瞌睡）","text":"真的……很好看……","scene":"carriage-drowsy"},{"speaker":"懷瑾（輕聲）","text":"清霜？","scene":"carriage-shoulder"},{"speaker":"懷瑾（有些害羞）","text":"……這麼快就睡著了。","scene":"carriage-shoulder"},{"speaker":"懷瑾（低聲）","text":"師傅，慢一些，別太顛。","scene":"carriage-shoulder"},{"speaker":"懷瑾（輕聲）","text":"睡吧，到了再叫妳。","scene":"carriage-shoulder"},{"speaker":"懷瑾（興奮）","text":"清霜！我剛從司天臺回來，有好消息！","scene":"observatory-good-news"},{"speaker":"清霜","text":"你一早就出門，是去問昨晚那件事？","scene":"observatory-good-news"},{"speaker":"懷瑾","text":"對！他們最近觀察星空時，好幾次看見圓環發出特別的光。","scene":"observatory-good-news"},{"speaker":"懷瑾","text":"出現的時刻也有規律，跟妳形容的很像。也許真的和妳來到這裡有關！","scene":"observatory-good-news"},{"speaker":"清霜","text":"真的？那我是不是有機會回家了？","scene":"observatory-good-news"},{"speaker":"懷瑾","text":"還不能確定，但終於有能繼續查的線索了！","scene":"observatory-good-news"},{"speaker":"清霜（看著兩人的手）","text":"你先慢慢說，我有在聽。","scene":"observatory-good-news"},{"speaker":"懷瑾（回過神）","text":"啊……抱歉，我一高興就……","scene":"observatory-good-news"},{"speaker":"清霜","text":"沒關係，我也很高興。謝謝你一直把我的事放在心上。","scene":"observatory-good-news"},{"speaker":"懷瑾","text":"等天色暗下來，我們一起去司天臺。朋友會帶我們看那座渾天儀。","scene":"observatory-good-news"},{"speaker":"清霜","text":"好，我把詩帖帶上，我們一起去。","scene":"observatory-good-news"}]},{"id":"beat-192","type":"line","scene":"armillary-intro","chapter":4,"when":null,"speaker":"清霜","text":"這就是你朋友說的圓環？"},{"id":"beat-193","type":"line","scene":"armillary-intro","chapter":4,"when":null,"speaker":"懷瑾","text":"這是渾天儀。"},{"id":"beat-194","type":"line","scene":"armillary-intro","chapter":4,"when":null,"speaker":"懷瑾","text":"這由好幾個套在一起的圓環組成，中間有一根可以轉動的觀測管。"},{"id":"beat-195","type":"line","scene":"armillary-intro","chapter":4,"when":null,"speaker":"懷瑾","text":"觀測的人透過管子對準星星，再讀取圓環上的刻度，就能記下星星在天空中的位置。"},{"id":"beat-196","type":"line","scene":"armillary-intro","chapter":4,"when":null,"speaker":"清霜","text":"看著實物，真的比看圖片清楚多了。"},{"id":"beat-197","type":"line","scene":"armillary-intro","chapter":4,"when":null,"speaker":"懷瑾","text":"清霜，圓環發光了！妳手裡的詩帖也在動。"},{"id":"beat-198","type":"line","scene":"armillary-intro","chapter":4,"when":null,"speaker":"清霜","text":"是這個感覺……跟我在博物館那時一樣。"},{"id":"beat-199","type":"line","scene":"armillary-intro","chapter":4,"when":null,"speaker":"懷瑾","text":"那我們試著把這個機關解開。妳看題目，我幫妳讀刻度。"},{"id":"beat-200","type":"line","scene":"armillary-quiz","chapter":4,"when":null,"speaker":"懷瑾","text":"這個機關要分三次操作。每答對三題，才能轉動一個圓環。"},{"id":"beat-201","type":"line","scene":"armillary-quiz","chapter":4,"when":null,"speaker":"清霜","text":"每題的兩個詞性都要對，才算完成一題。"},{"id":"beat-202","type":"line","scene":"armillary-quiz","chapter":4,"when":null,"speaker":"懷瑾","text":"第一題找出要轉的環，第二題看方向，第三題就會出現黃色對準點。"},{"id":"beat-203","type":"line","scene":"armillary-quiz","chapter":4,"when":null,"speaker":"清霜","text":"懂了。先解出三個線索，再把圓環轉到黃點的位置。"},{"id":"beat-204","type":"explore","scene":"armillary-quiz","chapter":4,"when":null,"game":"stars","hotspots":[{"x":53,"y":45,"label":"查看三道圓環","start":true}]},{"id":"beat-205","type":"game","scene":"armillary-quiz","chapter":4,"when 書、兵部侍郎、吏部侍郎等等。雖然翰林學士不領薪水，但是尚書、侍郎卻有不菲的薪水。翰林待詔和翰林供奉大都不兼職，可是他們卻有薪水，其中翰林待詔的薪水參照九品京官，翰林供奉的薪水參照八品京官。"],"credit":"改寫自李開周〈翰林的薪水〉","questions":["CAP115-33","CAP115-34"]},"touhu":{"title":"先看一場投壺比賽","paragraphs":["兩千多年前已有「投壺」這項活動，主要流行於先秦各國上流階層。投壺前，主客間要彼此請讓之後才開始，體現以禮數為旨的精神，而非娛樂競技。秦漢以後，投壺始普及於民間，逐漸演變為酒席宴會上的餘興節目。","正式開賽時，每人四枝箭，主人站左，客人站右，在離壺兩箭半的距離開始輪流投射。每投一箭，計分一次，未投入則得0分，由站在壺側面的司射（主持人）計分。四箭投完，司射計算總分，並宣告此局勝負，再由司正（監禮人）宣布罰酒。待三局兩勝，司正宣布贏家，並由司射宣布比賽結束。","【有初】當局第一箭就投中，得10分。","【連中】當局前一箭投中後，次一箭也投中，得5分。","【散箭】當局前一箭沒中，次一箭投中，得1分。","【有終】當局前三箭都沒中，最後一箭投中，得15分。"],"image":"assets/cap115-touhu-score-table.png","imageAlt":"投壺三局的客人與主人命中紀錄，勾表示投中、叉表示未投中","note":"這裡先閱讀四箭一局的示範賽；接著體驗的辨詞投壺是七題學習挑戰。聚會中主角飲用茶水。","questions":["CAP115-35","CAP115-36"]}},"questions":[{"id":"CAP115-10","number":10,"reading":"calligraphy","text":"《魏三體石經》每字皆刻三種字體，圖為部分拓本，已知其中二種字體為古文、篆書。據此判斷，圖中第三種字體應為下列何者？","options":["行書","草書","楷書","隸書"],"answer":"D","explanation":"答案是D，隸書。觀察拓本下排字形：形體較扁，橫畫向左右展開，具有隸書的筆畫特色。辨認書體可以幫助我們觀察書法；判斷文書是否遭竄改，仍須比對原稿與抄本。"},{"id":"CAP115-33","number":33,"reading":"hanlin","text":"關於文中翰林供奉的敘述，下列何者最恰當？","options":["可獨立辦公","有很多兼職收入","薪水比照八品京官","不能幫皇帝處理奏章"],"answer":"C","explanation":"答案是C。文章末段明確寫出翰林供奉的薪水參照八品京官。獨立辦公說的是翰林學士；翰林供奉大都不兼職，而且可以幫皇帝處理奏章。"},{"id":"CAP115-34","number":34,"reading":"hanlin","text":"根據本文，下列推論何者最恰當？","options":["尚書和侍郎通常也兼任翰林供奉","翰林學士處理政務的能力優於翰林供奉","翰林待詔是唐玄宗重要的行政幕僚之一","翰林待詔與翰林學士的差別在專門品級的高低"],"answer":"B","explanation":"答案是B。本文說翰林學士不光文筆一流，還通曉政治，因此可推知其處理政務的能力優於翰林供奉。三者都沒有專門的品級，不能用專門品級的高低區分。"},{"id":"CAP115-35","number":35,"reading":"touhu","text":"根據本文，下列關於投壺的敘述何者最恰當？","options":["主人要讓分給客人","由先秦的娛樂競技演變而來","參賽者各以四箭算一局勝負","司正以三局分數的總和判定贏家"],"answer":"C","explanation":"答案是C。每人四枝箭，投完才計算該局勝負。「請讓」是禮貌上的謙讓，不是讓分；先秦以禮數為旨；最終採三局兩勝，不是把三局分數相加。"},{"id":"CAP115-36","number":36,"reading":"touhu","text":"根據投壺規則及計分表，下列敘述何者正確？","options":["第一局客人勝","第二局主人勝","第三局客人勝","最終贏家是主人"],"answer":"C","explanation":"答案是C。第一局：客人0＋1＋0＋1＝2分，主人10＋0＋1＋0＝11分，主人勝。第二局：客人10分，主人0＋1＋5＋0＝6分，客人勝。第三局：客人前三箭皆未中，末箭「有終」得15分；主人第一箭「有初」得10分，所以客人勝。客人以二勝一負贏得比賽。
