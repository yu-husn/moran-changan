(()=>{
 'use strict';
 const unit=24,origin={x:320,y:267},scale=1.28,elevation=27*Math.PI/180;
 let yaw=38*Math.PI/180;
 const specs=[
  {axis:0,min:[-5,-2,-1],max:[5,0,1],sign:-1},
  {axis:2,min:[-2,-1,-5],max:[0,1,5],sign:1},
  {axis:1,min:[-1,-5,0],max:[1,5,2],sign:-1},
  {axis:2,min:[1,-1,-5],max:[3,1,5],sign:-1},
  {axis:0,min:[-5,0,-1],max:[5,2,1],sign:-1},
  {axis:1,min:[-1,-5,-2],max:[1,5,0],sign:-1}
 ];
 const colors=[[240,175,92],[216,139,63],[244,190,110],[201,120,51],[226,151,68],[234,166,85]];
 const key=v=>v.join(','),inside=(v,s)=>v.every((n,k)=>n>=s.min[k]&&n<s.max[k]);
 const cells=specs.map(()=>new Set());
 for(let x=-5;x<5;x++)for(let y=-5;y<5;y++)for(let z=-5;z<5;z++){
  const v=[x,y,z],candidates=specs.map((s,i)=>inside(v,s)?i:-1).filter(i=>i>=0);
  if(!candidates.length)continue;
  const owner=candidates[0];cells[owner].add(key(v));
 }
 // Greedy meshing makes each broad wooden face continuous. Exposed inner
 // surfaces remain in the mesh so removing a beam reveals its carved recess.
 function mesh(set){
  const planes=new Map();
  for(const value of set){const cell=value.split(',').map(Number);
   for(let axis=0;axis<3;axis++)for(const sign of [-1,1]){
    const neighbor=[...cell];neighbor[axis]+=sign;if(set.has(key(neighbor)))continue;
    const plane=cell[axis]+(sign>0?1:0),u=(axis+1)%3,v=(axis+2)%3,id=[axis,sign,plane].join(':');
    if(!planes.has(id))planes.set(id,{axis,sign,plane,u,v,grid:new Set()});planes.get(id).grid.add(cell[u]+','+cell[v]);
   }
  }
  const faces=[];
  for(const p of planes.values())while(p.grid.size){
   const [a,b]=p.grid.values().next().value.split(',').map(Number);let width=1,height=1;
   while(p.grid.has((a+width)+','+b))width++;
   while(Array.from({length:width},(_,i)=>p.grid.has((a+i)+','+(b+height))).every(Boolean))height++;
   for(let i=0;i<width;i++)for(let j=0;j<height;j++)p.grid.delete((a+i)+','+(b+j));
   faces.push({...p,grid:undefined,a:a*unit,b:b*unit,width:width*unit,height:height*unit,plane:p.plane*unit});
  }
  return faces;
 }
 const models=cells.map(mesh);
 const view=()=>[Math.sin(yaw)*Math.cos(elevation),Math.cos(yaw)*Math.cos(elevation),Math.sin(elevation)];
 function project(p){return {x:origin.x+scale*(p[0]*Math.cos(yaw)-p[1]*Math.sin(yaw)),y:origin.y+scale*((p[0]*Math.sin(yaw)+p[1]*Math.cos(yaw))*Math.sin(elevation)-p[2]*Math.cos(elevation))}}
 function pull(index){
  const p=[0,0,0];p[specs[index].axis]=specs[index].sign;const a=project([0,0,0]),b=project(p),length=Math.hypot(b.x-a.x,b.y-a.y);
  return {x:(b.x-a.x)/length,y:(b.y-a.y)/length,length};
 }
 function move(index,amount){const v=[0,0,0];v[specs[index].axis]=specs[index].sign*amount/pull(index).length;return v}
 function surfacePoint(face,u,v,offset){const p=[...offset];p[face.axis]+=face.plane;p[face.u]+=u;p[face.v]+=v;return project(p)}
 function ring(face,inset,offset){return [[face.a+inset,face.b+inset],[face.a+face.width-inset,face.b+inset],[face.a+face.width-inset,face.b+face.height-inset],[face.a+inset,face.b+face.height-inset]].map(([u,v])=>surfacePoint(face,u,v,offset))}
 const pts=points=>points.map(p=>p.x.toFixed(2)+','+p.y.toFixed(2)).join(' ');
 const tint=(color,factor)=>'rgb('+color.map(c=>Math.max(0,Math.min(255,Math.round(c*factor)))).join(',')+')';
 const light=axis=>[.67,.79,1][axis];
 function woodDefs(){
  return '<defs>'+colors.flatMap((color,i)=>[0,1,2].map(axis=>{
   const level=light(axis);
   return `<linearGradient id="solid-wood-${i}-${axis}" x1="0%" y1="0%" x2="85%" y2="100%"><stop stop-color="${tint(color,level*1.08)}"/><stop offset=".4" stop-color="${tint(color,level)}"/><stop offset="1" stop-color="${tint(color,level*.88)}"/></linearGradient>`;
  })).join('')+'<marker id="beam-anchor-tip" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3.1" fill="#ffedbd" stroke="#51321d" stroke-width="1.2"/></marker></defs>';
 }
 function grain(face,index,offset){
  if(face.axis===specs[index].axis){
   const centerU=face.a+face.width/2,centerV=face.b+face.height/2;
   return [.15,.29,.42].map((radius,j)=>{
    const points=Array.from({length:36},(_,k)=>{const angle=k/36*Math.PI*2,wave=1+.045*Math.sin(angle*3+index);return surfacePoint(face,centerU+Math.cos(angle)*face.width*radius*wave,centerV+Math.sin(angle)*face.height*radius*wave,offset)});
    return `<polygon class="end-grain" points="${pts(points)}" fill="none" stroke="${j===1?'#ffe0a0':'#603512'}" stroke-width="${j===1?.8:1}" opacity="${j===1?.5:.57}"/>`;
   }).join('');
  }
  const alongU=face.u===specs[index].axis,length=alongU?face.width:face.height,breadth=alongU?face.height:face.width;
  if(length<20)return '';
  return Array.from({length:Math.max(2,Math.floor(breadth/10))},(_,k)=>{
   const cross=(k+1)*breadth/(Math.max(2,Math.floor(breadth/10))+1),inset=3.5;
   const uv=(t,w)=>alongU?[face.a+t,face.b+w]:[face.a+w,face.b+t];
   const a=surfacePoint(face,...uv(inset,cross),offset),b=surfacePoint(face,...uv(length*.34,cross+Math.sin(k+index)*1.7),offset),c=surfacePoint(face,...uv(length*.7,cross-Math.cos(k)*1.7),offset),d=surfacePoint(face,...uv(length-inset,cross),offset);
   return `<path class="wood-grain" d="M${a.x} ${a.y}C${b.x} ${b.y} ${c.x} ${c.y} ${d.x} ${d.y}" fill="none" stroke="${k%3?'#633511':'#ffe9b8'}" stroke-width="${k%3?.85:1}" opacity="${k%3?.4:.55}"/>`;
  }).join('');
 }
 function faceSVG(face,index,offset,alpha=1){

function next(){state.at++;state.question=null;state.reply=null;save();render();}
function render(){stop();playing=true;while(state.at<C.beats.length){const b=current();if(b.type==='skip'){state.at++;state.question=null;state.reply=null;continue;}if((b.when&&!state.flags.includes(b.when))||(b.ifFlag&&!state.flags.includes(b.ifFlag))){state.at++;continue;}break;}save();const b=current();if(!b){result();return;}if(state.reply){reply(b);return;}switch(b.type){case'followup':state.reply={lines:b.followup,index:0};save();reply(b);break;case'line':line(b);break;case'reading':reading(b);break;case'exam':quizScreen(b,true);break;case'explore':explore(b);break;case'game':game(b);break;case'choice':choice(b);break;case'gift':gift(b);break;case'finish':state.finished=true;save();result();break;default:next();}}
function line(b){sceneShell(b,`<section class="dialogue-box"><div class="speaker ${/懷瑾/.test(b.speaker)?'male':''}">${esc(b.speaker)}</div><p class="dialogue-text">${esc(b.text)}</p><div class="dialogue-footer">${preview?'<span class="scene-progress">章節展示</span>':''}<div class="actions"><button class="btn small" id="read-line" aria-label="朗讀這句話">朗讀</button><button class="btn primary" id="dialogue-next">繼續</button></div></div></section>`,b.speaker);$('#dialogue-next').onclick=()=>{if(b.followup?.length){state.reply={lines:b.followup,index:0};save();reply(b);}else next();};$('#read-line').onclick=()=>speak(b.text);if(state.voice)speak(b.text);}
function readingHTML(r){return`<div class="reference-body">${r.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${r.image?`<img src="${r.image}" alt="${esc(r.imageAlt)}">`:''}${r.credit?`<p class="small-credit">${esc(r.credit)}</p>`:''}${r.note?`<p class="reading-note">${esc(r.note)}</p>`:''}</div>`;}
function reading(b){const r=C.exam.readings[b.reading];app.innerHTML=`<main class="reading-shell" data-screen="reading">${hud()}<article class="reading-card"><div class="eyebrow">會考文化小挑戰・先閱讀，不倒數</div><h1>${esc(r.title)}</h1>${readingHTML(r)}<p class="reading-note">讀完再繼續。題目出現後，每題會自動倒數20秒；作答時仍能查看原文與圖片。</p><div class="actions"><button class="btn primary" id="reading-next">讀完，繼續</button></div></article></main>`;bindHud();$('#reading-next').onclick=next;window.scrollTo(0,0);}
function quotedSpeaker(text){return /^([^：]+)：「/.exec(String(text||''))?.[1]||'';}
function clueDialogue(b,h,speaker){const text=h.text.replace(/^[^：]+：「([\s\S]*)」$/,'$1');sceneShell(b,`<section class="dialogue-box"><div class="speaker ${/懷瑾/.test(speaker)?'male':''}">${esc(speaker)}</div><p class="dialogue-text">${esc(text)}</p><div class="dialogue-footer"><div class="actions"><button class="btn small" id="clue-read">朗讀</button><button class="btn primary" id="clue-back">繼續觀察</button></div></div></section>`,speaker);$('#clue-read').onclick=()=>speak(text);$('#clue-back').onclick=()=>{cancelSpeech();explore(b);};if(state.voice)speak(text);}
function explore(b){sceneShell(b,`${b.hotspots.map((h,i)=>`<button class="hotspot ${h.start?'primary':''}" style="left:${h.x}%;top:${h.y}%" data-hotspot="${i}">${esc(h.label)}</button>`).join('')}<div class="exploration-copy"><div><b>${esc(C.chapters[b.chapter].hint)}</b><br><span class="muted">先觀察，再點選場景中的物件。</span></div><span class="note-pill">本關 ${C.chapters[b.chapter].count}題</span></div>`);document.querySelectorAll('[data-hotspot]').forEach(button=>button.onclick=()=>{const h=b.hotspots[Number(button.dataset.hotspot)];if(h.start)next();else{const speaker=quotedSpeaker(h.text);if(speaker)clueDialogue(b,h,speaker);else modal(`<h2>${esc(h.label)}</h2><p>${esc(h.text)}</p><button class="btn primary" data-close>繼續觀察</button>`);}});}
function choice(b){sceneShell(b,`<section class="dialogue-box"><div class="choice-label">${b.choice.scored?'這句話，會讓兩人的心靠得更近':'選擇往後生活的世界・不加減好感度'}</div><div class="speaker">${esc(b.choice.prompt)}</div><div class="choices">${b.choice.options.map((o,i)=>`<button class="choice" data-choice="${i}">${esc(o.label)}</button>`).join('')}</div></section>`,'清霜');document.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>{const o=b.choice.options[Number(button.dataset.choice)],prior=state.choices[b.choice.id];if(!prior){state.choices[b.choice.id]={option:o.id,label:o.label,affection:b.choice.scored?o.affection:0};if(!state.flags.includes(o.flag))state.flags.push(o.flag);if(b.choice.id==='world-choice')state.ending=o.flag;}state.reply={lines:o.response,index:0};save();if(b.choice.scored&&!prior)toast('彼此好感度 ＋'+o.affection);reply(b);});}
function reply(b){const r=state.reply,selected=b.choice?.options.find(o=>o.id===state.choices[b.choice.id]?.option),canonical=selected?.response||b.followup;
 // Continue past an obsolete follow-up without replaying it from an old save.
 if(b.type==='line'&&!canonical){next();return;}
 if(canonical){const cached=r.lines?.[r.index],same=(a,b)=>a&&b&&a.speaker===b.speaker&&a.text===b.text&&(a.scene||'')===(b.scene||'');if(cached&&!same(cached,canonical[r.index])){const matches=canonical.map((l,i)=>same(cached,l)?i:-1).filter(i=>i>=0);if(matches.length===1)r.index=matches[0];}r.lines=canonical;}
 while(r.index<r.lines.length&&r.lines[r.index].skip)r.index++;if(r.index>=r.lines.length){next();return;}save();
 const l=r.lines[r.index],view=l.scene?{...b,scene:l.scene}:b;sceneShell(view,`<section class="dialogue-box"><div class="speaker ${/懷瑾/.test(l.speaker)?'male':''}">${esc(l.speaker)}</div><p class="dialogue-text">${esc(l.text)}</p><div class="dialogue-footer">${l.scene?'':'<span class="scene-progress">你的選擇，留下了新的約定</span>'}<button class="btn primary" id="reply-next">繼續</button></div></section>`,l.speaker);$('#reply-next').onclick=()=>{if(++r.index<r.lines.length){save();reply(b);}else next();};if(state.voice)speak(l.text);}
function gift(b){if(!state.inventory.includes(b.item.id)){state.inventory.push(b.item.id);save();}sceneShell(b,`<section class="dialogue-box"><div class="souvenir"><img src="${b.item.image}" alt="同心結玉佩"><div><div class="eyebrow">收到信物</div><div class="speaker">同心結玉佩</div><p>兩道玉環交織，記下永結同心的心意。無論選擇哪個世界，玉佩都會留在清霜身邊。</p></div></div><div class="dialogue-footer"><span class="scene-progress">信物已收好</span><button class="btn primary" id="gift-next">收好玉佩</button></div></section>`);$('#gift-next').onclick=next;}
function currentGameIndex(id){return state.plan[id].findIndex(q=>!state.learned[q]);}
function game(b){const c=C.chapters[b.chapter];if(b.game==='stars'){const ring=state.rotated.findIndex(v=>!v);if(ring<0){next();return;}const ids=state.plan.stars.slice(ring*3,ring*3+3),clues=ids.filter(id=>state.learned[id]).length;if(clues===3&&!state.question){alignmentScreen(b,ring);return;}}
 let index=state.question&&state.question.game===b.game?state.plan[b.game].indexOf(state.question.id):currentGameIndex(b.game);if(index<0){next();return;}
 const q=bank.get(state.plan[b.game][index]);quizScreen(b,false,q,index,c);}
function questionState(q,isExam,b,index){if(state.question?.id===q.id)return state.question;state.question={id:q.id,game:isExam?'exam':b.game,index,answers:Array(isExam||C.chapters[b.chapter].targets===1?1:2).fill(''),slot:0,deadline:Date.now()+20000,feedback:null};save();return state.question;}
function quizHeader(title,sub){return`${hud()}<div class="play-heading"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><div class="timer-box" id="timer-box"><span>倒數</span><strong id="seconds">20</strong><span>秒</span></div></div><div class="time-bar"><i id="time-fill"></i></div>`;}
function quizScreen(b,isExam,q=null,index=0,c=null){q??=exam.get(b.question);const qs=questionState(q,isExam,b,index);const special=!isExam&&['luban','touhu','river'].includes(b.game);const titleText=isExam?'會考文化小挑戰':c.name;const sub=isExam?'閱讀判讀・每題2分':`${index+1}／${c.count}題・每題${c.targets}個詞性・${c.hint}`;
 app.innerHTML=`<main class="play-shell" data-screen="quiz" data-game="${isExam?'exam':b.game}" data-question="${q.id}">${quizHeader(titleText,sub)}<div class="play-layout ${!isExam?b.game+'-layout':''}">${isExam?`<details class="quiz-card exam-reference" open><summary>查看文章與圖片</summary>${readingHTML(C.exam.readings[q.reading])}</details>`:`<section class="board ${b.game}-board" id="board" aria-label="${esc(c.name)}操作區" style="--board-bg:url('${bg(b)}')"></section>`}<section class="quiz-card" id="quiz-card"></section></div></main>`;bindHud();
 if(!isExam){const master=state.plan[b.game].filter(id=>state.learned[id]).length,ring=state.rotated.findIndex(v=>!v),clues=b.game==='stars'?state.plan.stars.slice(ring*3,ring*3+3).filter(id=>state.learned[id]).length:0;
  board=ChanganInstruments.mount(b.game,$('#board'),{progress:master,index,total:c.count,ring,clues,angle:state.angles[ring]||0,rotated:state.rotated,unlocked:b.game==='stars'&&clues===3,
   onAngle:a=>{state.angles[ring]=a;save();},aligned:()=>{state.rotated[ring]=true;state.angles[ring]=0;state.question=null;save();sound(true);toast('第'+(ring+1)+'環已對準');setTimeout(()=>{if(current()?.id===b.id)render();},400);},
   elapsed:()=>Math.min(1,Math.max(0,(Date.now()-(qs.deadline-20000))/20000)),active:()=>!qs.feedback,
   choose:(value,timing=true)=>{if(qs.feedback)return;qs.answers[0]=value;submit(q,isExam,b,timing);}});cleanup=()=>board?.destroy();
 }
 renderQuiz(q,isExam,b,special);if(!qs.feedback)startClock(q,isExam,b);else{$('#timer-box').hidden=true;$('#time-fill').style.width='0%';}
 window.scrollTo(0,0);}
function renderQuiz(q,isExam,b,special){const qs=state.question,marks=[...q.text.matchAll(/「([^」]+)」/g)].map(m=>m[1]);const panel=$('#quiz-card');panel.innerHTML=`<div class="question-kicker">${isExam?'會考閱讀挑戰':C.chapters[b.chapter].targets===1?'判斷一個詞性':'兩處皆對，整題得2分'}</div><p class="question-text">${mark(q.text)}</p>${isExam?'':`<div class="slots">${qs.answers.map((a,i)=>`<button class="slot ${i===qs.slot?'active':''}" data-slot="${i}" ${qs.feedback?'disabled':''}>${esc(qs.answers.length===1&&marks.length>1?'標示語詞的共同詞性':marks[i]||'第'+(i+1)+'處')}：${esc(a||'請選擇')}</button>`).join('')}</div>`}${qs.feedback?'':special?`<p class="game-instruction">${esc(C.chapters[b.chapter].hint)}</p>`:`<div class="answer-options ${isExam?'exam-options':''}">${(isExam?['A','B','C','D']:types).map(t=>`<button class="answer-option ${isExam?'exam-option':''} ${qs.answers[qs.slot]===t?'chosen':''}" data-answer="${t}">${isExam?'<b>'+t+'</b>'+esc(q.options[t.charCodeAt(0)-65]):t}</button>`).join('')}</div><div class="question-actions"><button class="btn primary" id="submit-answer" ${qs.answers.some(a=>!a)?'disabled':''}>確認答案</button></div>`}<div id="feedback"></div>`;
 panel.querySelectorAll('[data-slot]').forEach(btn=>btn.onclick=()=>{qs.slot=Number(btn.dataset.slot);renderQuiz(q,isExam,b,special);});panel.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>{if(qs.feedback)return;qs.answers[qs.slot]=btn.dataset.answer;qs.slot=Math.min(qs.slot+1,qs.answers.length-1);save();renderQuiz(q,isExam,b,special);});$('#submit-answer')?.addEventListener('click',()=>submit(q,isExam,b));
 if(!isExam&&b.game==='touhu')ChanganInstruments.placeTouhuQuestion(panel);
 if(qs.feedback)feedback(q,isExam,b);}
function startClock(q,isExam,b){clearInterval(clock);const tick=()=>{const qs=state.question;if(!qs||qs.feedback)return;const remaining=Math.max(0,qs.deadline-Date.now());if($('#seconds'))$('#seconds').textContent=String(Math.ceil(remaining/1000)).padStart(2,'0');$('#timer-box')?.classList.toggle('urgent',remaining<=5000);if($('#time-fill'))$('#time-fill').style.width=remaining/20000*100+'%';if(remaining===0)submit(q,isExam,b,false,true);};tick();clock=setInterval(tick,70);}
function submit(q,isExam,b,timing=true,timeout=false){const qs=state.question;if(!qs||qs.id!==q.id||qs.feedback)return;clearInterval(clock);clock=null;const expected=isExam?[q.answer]:qs.answers.length===1?[q.answers[0]]:q.answers;const contentCorrect=qs.answers.length===expected.length&&qs.answers.every((a,i)=>a===expected[i]);const correct=!timeout&&contentCorrect&&timing;
 if(!state.records[q.id])state.records[q.id]={answers:[...qs.answers],correct,timeout,points:correct?2:0,at:Date.now(),attempts:1};else state.records[q.id].attempts=(state.records[q.id].attempts||1)+1;
 if(correct&&!state.learned[q.id]){state.learned[q.id]=true;if(!isExam){const ability=C.chapters[b.chapter].ability;state.abilities[ability]=Math.min(999,state.abilities[ability]+100);}}
 qs.feedback={correct,timeout,contentCorrect,timing};save();updateHud();$('#timer-box').hidden=true;$('#time-fill').style.width='0%';sound(correct);board?.feedback?.({correct,value:qs.answers[0]});renderQuiz(q,isExam,b,!isExam&&['luban','touhu','river'].includes(b.game));}
function feedback(q,isExam,b){const qs=state.question,r=qs.feedback,first=state.records[q.id];const title=r.correct?(first.points===2?'判斷正確，＋2分':'補解成功，首次分數不變'):r.timeout?'時間到，先看詳解再試一次':!r.timing&&b.game==='river'?'再檢查用法與接杯時機':'再想一想';
 const canContinue=r.correct,detail=r.correct?`<p>正解：${esc(isExam?q.answer+'．'+q.options[q.answer.charCodeAt(0)-65]:q.answers.join('／'))}</p><p>${esc(q.explanation)}</p>`:guidedExplanation(q);$('#feedback').innerHTML=`<section class="feedback ${r.correct?'':'wrong'}" role="status"><strong>${title}</strong>${detail}${!r.timing&&!isExam&&b.game==='river'?'<p>等杯子進入你判斷的座位前金框，再拿起杯子。</p>':''}<p class="small-credit">${first.points===0?'本題首次成績為0分；補解不改分數。':'本題首次成績已保留。'}</p><button class="btn primary" id="quiz-next">${canContinue?(isExam?'繼續故事':b.game==='stars'&&state.plan.stars.indexOf(q.id)%3===2?'轉動圓環':'繼續下一步'):'再試一次'}</button></section>`;
 $('#quiz-next').onclick=()=>{if(!canContinue){state.question={...qs,answers:qs.answers.map(()=>''),slot:0,deadline:Date.now()+20000,feedback:null};save();render();return;}state.question=null;save();if(isExam)next();else render();};}
function alignmentScreen(b,ring){app.innerHTML=`<main class="play-shell" data-screen="alignment" data-ring="${ring}">${quizHeader('渾天儀・三條線索已齊',`第${ring+1}環／共3環・依箭頭轉向大黃點`)}<div class="play-layout"><section class="board stars-board" id="board"></section><section class="quiz-card"><div class="eyebrow">操作不限時</div><h2>現在，轉動這一道圓環</h2><p class="question-text">三道不同題目，已提供圓環、方向和位置。</p><p class="game-instruction">拖動發亮的圓環，或使用下方「順轉／逆轉」按鈕。讓環上的白色標記，沿箭頭靠近大黃點；重合變綠，就算對準。</p><p>目前：<b id="angle-label">${state.angles[ring]}°</b></p></section></div></main>`;bindHud();$('#timer-box').hidden=true;$('#time-fill').style.width='0%';board=ChanganInstruments.mount('stars',$('#board'),{ring,clues:3,angle:state.angles[ring],rotated:state.rotated,unlocked:true,onAngle:a=>{state.angles[ring]=a;save();if($('#angle-label'))$('#angle-label').textContent=a+'°';},aligned:()=>{state.rotated[ring]=true;state.angles[ring]=0;save();sound(true);toast('第'+(ring+1)+'環已對準');setTimeout(()=>{if(current()?.id===b.id)render();},500);}});cleanup=()=>board?.destroy();}
function result(){stop();state.finished=true;save();const s=scores(),tang=state.ending==='endingTang',image=tang?'../artwork-drafts/scene-ending-tang-calligraphy-together-soft-v1.png':'../artwork-drafts/scene-ending-modern-museum-together-soft-v1.png';app.innerHTML=`<main class="result-screen" style="--bg:url('${image}')" data-screen="result"><article class="result-card"><div class="eyebrow">墨染長安・一筆相思</div><h1>${tang?'長安有你':'與你一起回家'}</h1><p>${tang?'桃花再開時，他們仍在同一扇窗前，一起寫字、一起生活。':'千年之後，展廳裡的詩依然動人。這一次，想見的人就在身旁。'}</p><p class="result-score">${s.total}<small>／100分</small></p><div class="score-breakdown"><div>詞性挑戰<strong>${s.pos}／80</strong></div><div>會考文化題<strong>${s.exam}／10</strong></div><div>彼此好感度<strong>${s.love}／10</strong></div></div><p>完成 ${s.answered}／45道計分題。首次答對 ${Object.values(state.records).filter(r=>r.correct).length} 題。</p><div class="stats">${Object.entries(state.abilities).map(([k,v])=>`<div class="stat">${k}<strong>${v}</strong>/ 999</div>`).join('')}</div>${state.inventory.includes('tongxin-jade-pendant')?'<div class="souvenir"><img src="../artwork-drafts/item-tongxin-jade-pendant-v1.png" alt="同心結玉佩"><p>同心結玉佩仍在清霜身邊。<br>每次看見它，都會記得那晚一起點亮的燈。</p></div>':''}<div class="actions"><button class="btn primary" id="result-records">查看成績與錯題</button><button class="btn" id="result-ending">重讀結局</button><button class="btn" id="result-title">回到封面</button></div><p class="muted">複習可再次理解題目，首次成績與彼此好感度保持不變。</p></article></main>`;$('#result-records').onclick=records;$('#result-title').onclick=title;$('#result-ending').onclick=()=>{state.at=C.beats.findIndex(b=>b.scene===(tang?'ending-tang':'ending-modern'));render();};window.scrollTo(0,0);}
document.addEventListener('keydown',e=>{if(e.defaultPrevented||overlay.open||/BUTTON|INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if((e.key==='Enter'||e.key===' ')&&$('#dialogue-next')){e.preventDefault();$('#dialogue-next').click();}});
window.addEventListener('pagehide',()=>{save();stop();});
window.ChanganGame=Object.freeze({get state(){return state?structuredClone(state):null;},get scores(){return scores();},get preview(){return preview;},get beat(){return current();},content:C,validatePlan:validPlan});
title();
})();
</script>
</body></html>
